[project]
name = "mbt-workspace"
version = "0.1.0"
description = "Workspace root for the mbt monorepo (not published)"
requires-python = ">=3.11"

[tool.uv]
package = false

# Sparkling Water pins pyspark <3.6 while mbt-spark rides Spark 4 (ADR-17);
# forking the resolution keeps the dev lock on current Spark. The sparkling
# backend is exercised against its own pinned resolution, not the dev env.
conflicts = [
    [
        { group = "dev" },
        { package = "mbt-h2o", extra = "sparkling" },
    ],
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mbt-adapter-base = { workspace = true }
mbt-core = { workspace = true }
mbt-testing = { workspace = true }
mbt-xgboost = { workspace = true }
mbt-mlflow = { workspace = true }
mbt-snowflake = { workspace = true }
mbt-h2o = { workspace = true }
mbt-spark = { workspace = true }
mbt-optuna = { workspace = true }
mbt-lightgbm = { workspace = true }

[dependency-groups]
dev = [
    "mbt-core",
    "mbt-adapter-base[compliance,metrics]",
    "mbt-testing",
    "mbt-xgboost",
    "mbt-mlflow",
    "mbt-snowflake",
    "mbt-h2o",
    "mbt-spark",
    "mbt-optuna",
    "mbt-lightgbm",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    # Lint-stack floors track the versions the repo actually enforces
    # (pre-commit revs / the strict-clean mypy claim); Renovate keeps them
    # grouped with the locked versions.
    "mypy>=2.0",
    "ruff>=0.15",
    "yamllint>=1.38",
    "pre-commit>=3.7",
    "jsonschema>=4.22",
    "types-PyYAML>=6.0",
    "mkdocs-material>=9.5",
    "moto[s3]>=5",
    "pytest-cov>=5",
    "pip-audit>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/mbt-core/src", "packages/mbt-adapter-base/src"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "C4",               # comprehensions
    "SIM",              # simplify
    "RUF",              # ruff-specific
    "PL",               # pylint subset
    "T20",              # no stray prints (CLI uses rich/typer echo)
]
ignore = [
    "PLR0913",  # many arguments: adapter contracts are wide by design
    "PLR2004",  # magic values in tests and thresholds
    "PLR0912",  # complex branch logic in parser/scheduler is explicit by design
    "PLR0915",
    "PLR0911",
    "SIM108",   # ternary is not always clearer
    "PLC0415",  # lazy imports are load-bearing: plugin import hygiene (ADR-14),
                # framework-free parse path, and CLI startup time
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["T20", "PLC1901"]
"examples/**" = ["T20"]
"scripts/**" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
mypy_path = "packages/mbt-core/src:packages/mbt-adapter-base/src:packages/mbt-xgboost/src:packages/mbt-mlflow/src:packages/mbt-snowflake/src:packages/mbt-h2o/src:packages/mbt-spark/src:packages/mbt-optuna/src:packages/mbt-lightgbm/src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "duckdb.*",
    "networkx.*",
    "pyarrow.*",
    "xgboost.*",
    "lightgbm.*",
    "mlflow.*",
    "snowflake.*",
    "h2o.*",
    "pyspark.*",
    "pysparkling.*",
    "optuna.*",
    "sklearn.*",
    "jsonschema.*",
    "boto3.*",
]
ignore_missing_imports = true

# pyarrow.parquet / pyarrow.compute are untyped upstream; the modules built
# on them stay strict for everything else.
[[tool.mypy.overrides]]
module = [
    "mbt_adapter_base.materialization",
    "mbt_adapter_base.predictions",
    "mbt_snowflake.adapter",
    "mbt_h2o.adapter",
    "mbt_spark.data",
    "mbt_spark.training",
    "mbt.execute.job",
]
disable_error_code = ["no-untyped-call", "attr-defined"]

[tool.coverage.run]
# Coordinator-process coverage; training-job subprocesses are not traced.
# Subprocess-side modules (execute/job.py, plugin entry points) are held at
# 100% by in-process unit tests that call their functions directly.
source_pkgs = [
    "mbt",
    "mbt_adapter_base",
    "mbt_xgboost",
    "mbt_lightgbm",
    "mbt_mlflow",
    "mbt_optuna",
    "mbt_snowflake",
    "mbt_testing",
]
omit = ["*/_scaffold/*"]

[tool.coverage.report]
precision = 1
skip_empty = true
# The fast suite covers every line; CI's test job runs with --cov, so any
# uncovered new line fails the build. JVM-bound packages (mbt-spark, mbt-h2o)
# are exercised by the e2e tier instead and stay outside source_pkgs.
fail_under = 100

[tool.pytest.ini_options]
testpaths = [
    "packages/mbt-core/tests",
    "packages/mbt-adapter-base/tests",
    "packages/mbt-xgboost/tests",
    "packages/mbt-mlflow/tests",
    "packages/mbt-snowflake/tests",
    "packages/mbt-h2o/tests",
    "packages/mbt-spark/tests",
    "packages/mbt-optuna/tests",
    "packages/mbt-lightgbm/tests",
    "packages/mbt-testing/tests",
    "tests",
]
# No -q here: the documented commands pass -q themselves, and doubling it
# (-qq) suppresses the final pass/fail summary line entirely.
addopts = "--strict-markers"
markers = [
    "e2e: end-to-end tests exercising the full CLI loop (slower)",
    "perf: performance budget tests (NFR-03)",
    "live: live external-system integration tests (opt-in via MBT_LIVE_* env vars)",
    "live_snowflake: live Snowflake tests (MBT_LIVE_SNOWFLAKE=1 + SNOWFLAKE_* env vars; see packages/mbt-snowflake/README.md)",
    "live_showcase: docker-compose showcase stack tests (MBT_LIVE_SHOWCASE=1 + local docker; see examples/showcase/README.md)",
]
timeout = 600

[tool.ruff.lint.extend-per-file-ignores]
"packages/mbt-core/src/mbt/cli/_scaffold/**" = ["ALL"]
