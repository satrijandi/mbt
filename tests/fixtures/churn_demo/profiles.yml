# Demo profiles: everything local, sqlite-backed MLflow. No secrets here.
churn_demo:
  target: dev
  outputs:
    dev:
      data: {adapter: local, config: {root: .}}
      tracking: {adapter: mlflow, config: {uri: "sqlite:///mlflow.db"}}
      registry: {adapter: mlflow, config: {uri: "sqlite:///mlflow.db"}}
      compute: {adapter: local}
      artifact_store: file://./target/artifacts
      threads: 2
      vars:
        sample_fraction: 1.0
        max_tuning_trials: 3
    ci:
      data: {adapter: local, config: {root: .}}
      tracking: {adapter: fake, config: {root: ./target/fake_tracking}}
      registry: {adapter: fake, config: {root: ./target/fake_registry}}
      compute: {adapter: local}
      artifact_store: file://./target/artifacts
      threads: 2
      vars:
        sample_fraction: 1.0
        max_tuning_trials: 3
