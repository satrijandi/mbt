# Coverage config for the JVM e2e tier (mbt-spark, mbt-h2o).
#
# These two packages are deliberately absent from `[tool.coverage.run]
# source_pkgs` in pyproject.toml: they need a JVM, so the fast suite cannot
# exercise them and including them there would make the 100% gate unreachable.
# The published claim was that "the e2e tier covers them instead"
# (docs/v0.1-status.md, NFR-08) - and until 2026-09-01 nothing measured it, so
# it was an assertion, not a fact (FEEDBACK v3 B-3). This file makes the e2e
# job measure it.
#
# First measurement, 2026-09-01, on the full e2e tier: 84.1% (792 statements,
# 126 missed) - h2o/adapter 87.4%, spark/data 79.9%, spark/compute 78.6%,
# spark/training 94.5%. The floor below is set just under that so it can only
# ratchet upwards; raise it when the number rises, never lower it to make a
# red build green.
#
# The zero-coverage modules are honest, not gaps: `mbt_spark/plugin.py`,
# `mbt_h2o/plugin.py`, and `mbt_spark/job_wrapper.py` execute inside
# spark-submit subprocesses, which coverage does not trace - the same reason
# `mbt/execute/job.py` is held at 100% by in-process unit tests instead.

[run]
source_pkgs =
    mbt_spark
    mbt_h2o

[report]
precision = 1
skip_empty = true
fail_under = 83
