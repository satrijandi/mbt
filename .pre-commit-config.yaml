repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-d, "{extends: relaxed, rules: {line-length: {max: 140}}}"]
        files: ^(packages|examples)/
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict (mbt-core + adapter-base)
        entry: uv run mypy packages/mbt-core/src packages/mbt-adapter-base/src
        language: system
        pass_filenames: false
        files: '\.py$'
