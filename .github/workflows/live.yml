# Live external-system integration tier (B-tier of the integration-test
# plan): runs nightly and on demand, never on PRs (fork PRs cannot see
# secrets, and a flaky external system must not block merges). Credentialed
# jobs no-op with an explicit notice when their secrets are not configured;
# the showcase job needs only the runner's docker daemon.
name: Live integration

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# One live run at a time: a manual dispatch during the nightly window must
# queue, not race it (both drive the same external systems). Never cancel a
# live run mid-flight - half-torn-down stacks leak containers.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write   # the failure notice below; a red nightly nobody reads is not a detector

jobs:
  snowflake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync workspace
        run: uv sync
      - name: Materialize key-pair credential (when configured)
        if: env.SNOWFLAKE_PRIVATE_KEY != ''
        run: |
          umask 077
          printf '%s' "$SNOWFLAKE_PRIVATE_KEY" > "$RUNNER_TEMP/snowflake_key.p8"
          echo "SNOWFLAKE_PRIVATE_KEY_FILE=$RUNNER_TEMP/snowflake_key.p8" >> "$GITHUB_ENV"
      - name: Live Snowflake suite
        if: env.SNOWFLAKE_ACCOUNT != ''
        env:
          MBT_LIVE_SNOWFLAKE: "1"
        run: uv run pytest -q -m live_snowflake --timeout 900 -rA
      - name: Not configured
        if: env.SNOWFLAKE_ACCOUNT == ''
        run: echo "SNOWFLAKE_* secrets are not configured - live Snowflake suite was not run."

  # The docker-compose showcase stack (examples/showcase): builds the runner
  # image, boots SeaweedFS + MLflow + Spark + Gitea/Woodpecker + Zot +
  # Airflow + observability, and runs the lifecycle, CI-loop, provenance,
  # and scheduling tiers. The k3d/ArgoCD module needs MBT_LIVE_SHOWCASE_K3D=1
  # and stays local-only. No secrets needed - docker ships on ubuntu-latest.
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Free runner disk space (the runner image alone is ~5GB)
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Sync workspace
        run: uv sync
      - name: Showcase stack suite
        env:
          MBT_LIVE_SHOWCASE: "1"
        run: uv run pytest -q -m live_showcase --timeout 3600 -rA
      - name: Runbook (make targets) tier
        # SHOW-18: the README golden path via make, in its own pytest
        # invocation AFTER the session stack is torn down (two full stacks
        # at once would exceed the RAM guardrails).
        env:
          MBT_LIVE_SHOWCASE: "1"
          MBT_LIVE_SHOWCASE_MAKE: "1"
        run: uv run pytest -q tests/test_showcase_make.py --timeout 3600 -rA
      - name: Collect stack logs
        # A red 2-hour docker run without logs can only be debugged by
        # rerunning; grab every container's output while it is still up.
        # Test stacks use per-session project names (mbt-show-<id>,
        # mbt-make-<id>), so sweep by name prefix instead of one project.
        if: failure()
        run: |
          for c in $(docker ps -aq --filter "name=mbt-"); do
            name=$(docker inspect --format '{{.Name}}' "$c" | tr -d /)
            docker logs --timestamps "$c" > "showcase-$name.log" 2>&1 || true
          done
          docker ps -a > showcase-containers.log 2>&1 || true
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            showcase-*.log
            showcase-containers.log

  notify:
    # This tier is the only thing that exercises mbt against real external
    # systems, and nothing here runs on a PR - so a regression it catches is
    # visible ONLY if someone opens the Actions tab. Twice now that has not
    # happened: six consecutive red nightlies on the 0600 atomic-write bug,
    # and a whole day of red on an unpinned transitive. upstream.yml already
    # files a notice for exactly this reason; this is the same mechanism on
    # the tier that actually needed it first.
    #
    # One issue, commented on rather than duplicated, closed automatically
    # when the nightly goes green again.
    needs: [snowflake, showcase]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Raise or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Live integration is failing"
          SNOWFLAKE_OUTCOME: ${{ needs.snowflake.result }}
          SHOWCASE_OUTCOME: ${{ needs.showcase.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title --jq "[.[] | select(.title == env.TITLE)][0].number // empty")

          failed=""
          if [ "$SNOWFLAKE_OUTCOME" = "failure" ]; then failed="$failed snowflake"; fi
          if [ "$SHOWCASE_OUTCOME" = "failure" ]; then failed="$failed showcase"; fi

          if [ -z "$failed" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Live integration is green again: $RUN_URL"
            fi
            exit 0
          fi

          body=$(printf '%s\n' \
            "Failing job(s):$failed" \
            "" \
            "Run (failure diagnostics are attached as the \`showcase-diagnostics\`" \
            "artifact - every container's logs): $RUN_URL" \
            "" \
            "Triage notes:" \
            "- This tier runs on Linux; the showcase passes on macOS Docker Desktop" \
            "  even when it is broken, because bind mounts there present host-user" \
            "  ownership regardless of the in-container uid. Judge a fix on Linux." \
            "- live.yml has workflow_dispatch: never wait for the 03:17 UTC cron to" \
            "  check a fix." \
            "- \"Task failed with exception / mbt_monitor.monitor try 2/2\" in a" \
            "  showcase log is the DAG exit-code-routing test driving a deliberate" \
            "  failure, not a real one." \
            "- The snowflake job passes vacuously when SNOWFLAKE_* secrets are not" \
            "  configured; a failure there is a real one.")

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
