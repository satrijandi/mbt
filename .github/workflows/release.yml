name: release

# Build wheels + cut a GitHub release when a version tag (vX.Y.Z) is pushed.
#
# One-time organizational prerequisites (until then this workflow is inert - it
# only fires on a `v*` tag): create the PyPI projects and configure Trusted
# Publishing (https://docs.pypi.org/trusted-publishers/) for this repo and the
# `release` environment. The scaffold's git-ref pins resolve off the same tag,
# so a fresh user project's CI installs from the tag even before PyPI exists.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # create the GitHub release
  id-token: write  # PyPI Trusted Publishing (OIDC) - no long-lived API token

jobs:
  ci:
    # Gate the release on the repo's real CI: a tag on a red commit must never
    # publish broken, immutable wheels for all 10 packages (R2-1). Calling
    # ci.yml via workflow_call - rather than re-declaring a subset of checks
    # here - keeps the gate honest: it is exactly what guards main, so it can
    # never silently drift from it.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    secrets: inherit

  release:
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Build all workspace wheels and sdists
        run: uv build --all-packages
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # 10 wheels do not upload atomically; if a publish fails partway, a
          # re-run must skip the packages that already landed instead of
          # hard-failing on "file already exists". Makes the publish idempotent.
          skip-existing: true
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
