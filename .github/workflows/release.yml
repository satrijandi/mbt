name: release

# Build wheels + cut a GitHub release when a version tag (vX.Y.Z) is pushed.
#
# The PyPI publish is an explicit opt-in: it runs only when the repo variable
# PYPI_TRUSTED_PUBLISHING is set to 'enabled'. One-time organizational
# prerequisites before flipping it: create the PyPI projects and configure
# Trusted Publishing (https://docs.pypi.org/trusted-publishers/) for this repo
# and the `release` environment. Until then a tag still produces a fully green
# run with the GitHub release + wheels attached (the v0.1.0 tag proved that an
# unconfigured publisher otherwise fails `invalid-publisher` and, ordered
# first, blocks the GitHub release behind it). The scaffold's git-ref pins
# resolve off the same tag, so a fresh user project's CI installs from the tag
# even before PyPI exists.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write       # create the GitHub release
  id-token: write       # PyPI Trusted Publishing (OIDC) - no long-lived API token
  attestations: write   # SLSA build provenance for the wheels (see below)

jobs:
  ci:
    # Gate the release on the repo's real CI: a tag on a red commit must never
    # publish broken, immutable wheels for all 10 packages (R2-1). Calling
    # ci.yml via workflow_call - rather than re-declaring a subset of checks
    # here - keeps the gate honest: it is exactly what guards main, so it can
    # never silently drift from it.
    uses: ./.github/workflows/ci.yml
    # A reusable call's caller job must grant EVERYTHING the called workflow
    # declares anywhere, or GitHub refuses the run at startup - even for jobs
    # (ci.yml's docs-publish) whose main-only `if:` skips them on a tag. The
    # first v0.1.0 tag failed with startup_failure on exactly this;
    # tests/test_release_workflow.py now pins the envelope.
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write   # ci.yml's notify job; skipped on a tag, still in the envelope
    secrets: inherit

  release:
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # generate_changelog.py reads tags and commit history
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Changelog matches the tag history
        # Checked HERE and not in ci.yml on purpose: the generated file carries
        # an "Unreleased" section derived from commits after the newest tag, so
        # on an ordinary push it legitimately differs on every commit. At a tag
        # that section is empty by construction, which makes this the one place
        # the check is both stable and meaningful.
        run: |
          git fetch --tags --force
          uv run --no-project python scripts/generate_changelog.py --check
      - name: Build all workspace wheels and sdists
        run: uv build --all-packages
      - name: Attest build provenance
        # Signed, verifiable SLSA provenance for every artifact a user can
        # install: which workflow, which commit, which runner produced it.
        # The rest of the supply chain was already covered (pip-audit, CodeQL,
        # gitleaks over full history, digest-pinned images and oras provenance
        # in the showcase); the published wheels were the one gap, which is
        # backwards - they are the only artifacts that leave this repo.
        # Verify with: gh attestation verify <file> --repo satrijandi/mbt
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      # The GitHub release comes FIRST: it needs nothing but the wheels, and a
      # failed (or gated-off) PyPI publish must never block the artifact users
      # actually consume today - the tag's release with wheels attached.
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # wheels + sdists only: uv build drops a .gitignore into dist/,
          # which a bare dist/* glob attached to v0.1.0 as a stray
          # "default.gitignore" asset (removed by hand there)
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
      - name: Publish to PyPI (Trusted Publishing)
        # Opt-in switch (see header): flipping the repo variable to 'enabled'
        # is the same one-time act as configuring the PyPI side, so a real
        # publish failure after that fails the run loudly - no silent skips.
        if: vars.PYPI_TRUSTED_PUBLISHING == 'enabled'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # 10 wheels do not upload atomically; if a publish fails partway, a
          # re-run must skip the packages that already landed instead of
          # hard-failing on "file already exists". Makes the publish idempotent.
          skip-existing: true
