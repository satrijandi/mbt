name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # release.yml gates publishing on this exact CI passing (R2-1)

# Superseded pushes to the same PR/branch cancel their in-flight runs; main
# never cancels (a half-cancelled Pages deploy is worse than a queued one).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-type:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync workspace
        run: uv sync
      - name: Ruff
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: mypy --strict
        run: >-
          uv run mypy packages/mbt-core/src packages/mbt-adapter-base/src
          packages/mbt-xgboost/src packages/mbt-mlflow/src
          packages/mbt-optuna/src packages/mbt-lightgbm/src
          packages/mbt-testing/src packages/mbt-snowflake/src
          packages/mbt-spark/src packages/mbt-h2o/src
      - name: yamllint
        run: 'uv run yamllint -d "{extends: relaxed, rules: {line-length: {max: 140}}}" packages examples tests/fixtures .github'
      - name: No ML frameworks in mbt-core (NFR-04)
        run: |
          uv run python - <<'EOF'
          import subprocess, sys
          probe = (
              "import sys\n"
              "import mbt.cli.main, mbt.parsing, mbt.compile.compiler, mbt.execute.orchestrator\n"
              "banned = [m for m in ('xgboost','lightgbm','sklearn','torch','mlflow','optuna')"
              " if m in sys.modules]\n"
              "assert not banned, f'ML frameworks imported by mbt-core: {banned}'\n"
          )
          subprocess.run([sys.executable, '-c', probe], check=True)
          EOF

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every Python that requires-python (>=3.11) advertises is tested.
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Sync workspace
        run: uv sync
      - name: Unit + integration tests (with coverage)
        # Coordinator-process coverage; job subprocesses are not traced.
        # Coverage (and the wall-clock perf budgets) run once, on the floor
        # interpreter: tracing 4x proves nothing extra, and one perf sample
        # per run quarters the timing-flake surface.
        if: matrix.python == '3.11'
        run: uv run pytest -q -m "not e2e" --timeout 600 --cov --cov-report=term --durations=10
      - name: Unit + integration tests
        if: matrix.python != '3.11'
        run: uv run pytest -q -m "not e2e and not perf" --timeout 600 --durations=10

  floors:
    # Declared lower bounds are only honest if something installs them:
    # resolve every direct dependency at its floor (transitives resolve
    # normally) and run the fast suite against that environment.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync workspace at dependency floors
        run: uv sync --resolution lowest-direct
      - name: Unit + integration tests against floors
        run: uv run pytest -q -m "not e2e" --timeout 600
      - name: pip-audit against floors
        # The locked env is audited in the security job; floors are what a
        # user MAY install, so a floor version with a known CVE must raise
        # the floor, not ship.
        # --no-check-stale because this resolution is deliberately NOT the
        # locked one: an accepted advisory may legitimately not apply to these
        # versions, and that is not a reason to fail. The locked environment is
        # the authority on whether an acceptance is still earned.
        run: uv run python scripts/audit_dependencies.py --no-check-stale

  e2e:
    # The JVM tier (Spark 4.x per the locked resolution, H2O) runs once on
    # the floor interpreter: it proves the adapter seams, while Python-version
    # coverage is the test job's matrix. Sparkling Water stays pinned to
    # Spark 3.5 in its own resolution fork (ADR-17).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: actions/setup-java@v4   # H2O + Spark adapters need a JVM
        with: {distribution: temurin, java-version: "17"}
      - name: Sync workspace
        run: uv sync
      - name: End-to-end (XGBoost/LightGBM/H2O/Spark + MLflow sqlite)
        run: uv run pytest -q -m e2e --timeout 1800 --durations=10
      - name: Upload failure diagnostics
        # Manifests, run results, and logs from the pytest tmp trees; without
        # these a red e2e run can only be debugged by rerunning locally.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            /tmp/pytest-of-*/pytest-*/**/target/run_results.json
            /tmp/pytest-of-*/pytest-*/**/target/manifest.json
            /tmp/pytest-of-*/pytest-*/**/*.log

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync workspace
        run: uv sync
      - name: pip-audit (known-vulnerability scan of the locked environment)
        # A wrapper rather than bare `pip-audit --ignore-vuln`: an ignore flag
        # keeps passing forever once the advisory stops applying, so the
        # suppression outlives its reason and reads to the next person as
        # "recently reviewed". The wrapper fails on an unaccepted finding AND
        # on an acceptance that no longer fires, so the list has to keep being
        # earned. Each entry's rationale lives in ACCEPTED in that script.
        run: uv run python scripts/audit_dependencies.py

  secrets-scan:
    # Complements CodeQL/pip-audit: scans the git history for committed
    # credentials. Free for personal accounts; an org fork needs a
    # GITLEAKS_LICENSE secret (see gitleaks/gitleaks-action docs).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, or leaks in old commits stay invisible
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync workspace
        run: uv sync
      - name: Build docs site (strict - broken nav/links fail the build)
        run: uv run mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with: {path: site/}

  docs-publish:
    # Publish the strict-built site to GitHub Pages on main. One-time repo
    # setup: Settings -> Pages -> Source: GitHub Actions.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
