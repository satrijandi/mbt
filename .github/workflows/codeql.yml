# Static security analysis (CodeQL) alongside the dependency scan
# (pip-audit in ci.yml). Requires code scanning to be available on the
# hosting repo (public repos, or GitHub Advanced Security on private ones).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"  # weekly, off the :00 stampede

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63   # v4.38.0
        with:
          languages: python
          # Source only: generated scaffolds are user-project templates and
          # the docs build is not shipped code.
          config: |
            paths:
              - packages
            paths-ignore:
              - packages/mbt-core/src/mbt/cli/_scaffold
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63   # v4.38.0
        with:
          category: "/language:python"
