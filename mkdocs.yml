site_name: mbt - Model Build Tool
site_description: dbt for machine learning models
site_url: https://satrijandi.github.io/mbt/
repo_url: https://github.com/satrijandi/mbt
edit_uri: edit/main/docs/
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle: {icon: material/brightness-7, name: dark mode}
    - scheme: slate
      primary: indigo
      toggle: {icon: material/brightness-4, name: light mode}
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Tutorial: tutorial.md
  - Showcase: showcase.md
  - Concepts: concepts.md
  - Spec reference: spec-reference.md
  - Naming conventions: naming-conventions.md
  - CLI reference: cli-reference.md
  - GitOps & CI: gitops.md
  - Troubleshooting: troubleshooting.md
  - Adapter authoring: adapter-authoring.md
  - Adapter API reference: api-reference.md
  - Architecture: architecture.md
  - Roadmap: roadmap.md
  - v0.1 status: v0.1-status.md
  - MLOps alignment: mlops-alignment.md
  - ADRs:
      - adr/0001-arrow-interchange.md
      - adr/0002-local-adapters-in-core.md
      - adr/0003-coordinator-job-split.md
      - adr/0004-two-hashes.md
      - adr/0005-profiles-excluded-from-hashes.md
      - adr/0006-gate-edits-retrain.md
      - adr/0007-env-digest-not-modifying.md
      - adr/0008-tuning-never-sees-test.md
      - adr/0009-champion-reevaluated-in-job.md
      - adr/0010-missing-vs-unloadable-champion.md
      - adr/0011-snapshot-mtime-listing.md
      - adr/0012-window-expressions-and-anchor.md
      - adr/0013-upstream-datasets-auto-materialize.md
      - adr/0014-plugin-import-hygiene.md
      - adr/0015-contract-refinements.md
      - adr/0016-multi-table-inputs-and-key-sampling.md
      - adr/0017-jvm-adapters-and-path-data-access.md
      - adr/0018-paired-bootstrap-champion-gates.md
      - adr/0019-env-freeze-digest-and-manifest-verification.md
      - adr/0020-scoring-resource-and-runtime-champion.md
      - adr/0021-prediction-store-and-ground-truth-ledger.md
      - adr/0022-population-spine-and-per-table-joins.md
      - adr/0023-warehouse-batch-scoring.md
      - adr/0024-regression-task-vertical.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - tables

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
