[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mbt-snowflake"
version = "0.1.0"
description = "Snowflake data adapter for mbt: warehouse-native dataset construction"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Nugroho Satrijandi", email = "satrijandi@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "mbt-adapter-base>=0.1.0,<0.2",
    # 3.13.1 clears the connector's own advisories (PYSEC-2024-191,
    # PYSEC-2025-26/27/28), but everything below 4.4.0 caps pyOpenSSL, which
    # transitively strands cryptography on a vulnerable 46.0.x. 4.4.0 is the
    # first release requiring cryptography>=46.0.5 with no pyOpenSSL ceiling,
    # which lets the pair resolve clean.
    "snowflake-connector-python>=4.4.0",
]

[project.optional-dependencies]
# externalbrowser SSO token caching: the connector only persists tokens
# through keyring (its secure-local-storage extra, available since well
# before our 3.7 floor). Without it client_store_temporary_credential is a
# silent no-op and every connection re-prompts the browser.
sso = ["snowflake-connector-python[secure-local-storage]>=4.4.0"]

[project.urls]
Homepage = "https://github.com/satrijandi/mbt"
Documentation = "https://satrijandi.github.io/mbt/"
Repository = "https://github.com/satrijandi/mbt"
Issues = "https://github.com/satrijandi/mbt/issues"

[project.entry-points."mbt.adapters"]
snowflake = "mbt_snowflake.plugin:PLUGIN"

[tool.hatch.build.targets.wheel]
packages = ["src/mbt_snowflake"]
