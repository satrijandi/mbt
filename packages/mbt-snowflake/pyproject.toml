[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mbt-snowflake"
version = "0.1.0"
description = "Snowflake data adapter for mbt: warehouse-native dataset construction"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "mbt-adapter-base>=0.1.0,<0.2",
    "snowflake-connector-python>=3.7",
]

[project.entry-points."mbt.adapters"]
snowflake = "mbt_snowflake.plugin:PLUGIN"

[tool.hatch.build.targets.wheel]
packages = ["src/mbt_snowflake"]
