[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mbt-lightgbm"
version = "0.1.0"
description = "LightGBM training adapter for mbt (the extensibility proof)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Nugroho Satrijandi", email = "satrijandi@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "mbt-adapter-base[metrics]>=0.1.0,<0.2",
    # 4.4 was the first release with macOS arm64 wheels; 4.6 is the first
    # without PYSEC-2024-231, and the floors audit gates on that.
    "lightgbm>=4.6",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/satrijandi/mbt"
Documentation = "https://satrijandi.github.io/mbt/"
Repository = "https://github.com/satrijandi/mbt"
Issues = "https://github.com/satrijandi/mbt/issues"

[project.entry-points."mbt.adapters"]
lightgbm = "mbt_lightgbm.plugin:PLUGIN"

[tool.hatch.build.targets.wheel]
packages = ["src/mbt_lightgbm"]
