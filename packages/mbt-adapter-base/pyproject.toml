[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mbt-adapter-base"
version = "0.1.0"
description = "mbt adapter contracts, interchange types, and the adapter compliance suite"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Nugroho Satrijandi", email = "satrijandi@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "pydantic>=2.7",
    "pyarrow>=15.0",
]

[project.urls]
Homepage = "https://github.com/satrijandi/mbt"
Documentation = "https://satrijandi.github.io/mbt/"
Repository = "https://github.com/satrijandi/mbt"
Issues = "https://github.com/satrijandi/mbt/issues"

[project.optional-dependencies]
# Shared metric computation helpers for tabular training adapters.
metrics = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
]
# The adapter compliance test suite (pytest base classes).
compliance = [
    "pytest>=8.0",
    "numpy>=1.26",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mbt_adapter_base"]
