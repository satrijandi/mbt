[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mbt-mlflow"
version = "0.3.0.dev0"
description = "MLflow tracking and registry adapters for mbt"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Nugroho Satrijandi", email = "satrijandi@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "mbt-adapter-base>=0.3.0.dev0,<0.4",
    # 2.16 was the first release importable in setuptools-free environments
    # (older ones import pkg_resources), and use_aliases=false still covers old
    # servers - but 2.16 carries ~30 advisories, so the floor is the first
    # release clear of all of them (PYSEC-2026-3687 fixes last, in 3.15.0).
    # Raised 3.15 -> 3.17.2: 3.15.0 still carries GHSA-2wqp-q3c6-ccj5 and
    # GHSA-j7qq-vr8c-xvw3 (fixed in 3.17.0) and GHSA-wqmh-qccw-pqwf (fixed in
    # 3.17.2), so the floors job was installing a tracking client with known
    # advisories. The lock already ships 3.18.0; only the declared floor was exposed.
    "mlflow>=3.17.2",
]

[project.urls]
Homepage = "https://github.com/satrijandi/mbt"
Documentation = "https://satrijandi.github.io/mbt/"
Repository = "https://github.com/satrijandi/mbt"
Issues = "https://github.com/satrijandi/mbt/issues"

[project.entry-points."mbt.adapters"]
mlflow = "mbt_mlflow.plugin:PLUGIN"

[tool.hatch.build.targets.wheel]
packages = ["src/mbt_mlflow"]
