[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mbt-mlflow"
version = "0.1.0"
description = "MLflow tracking and registry adapters for mbt"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "mbt-adapter-base>=0.1.0,<0.2",
    # 2.16: first release importable in setuptools-free environments (older
    # ones import pkg_resources). use_aliases=false still covers old servers.
    "mlflow>=2.16",
]

[project.entry-points."mbt.adapters"]
mlflow = "mbt_mlflow.plugin:PLUGIN"

[tool.hatch.build.targets.wheel]
packages = ["src/mbt_mlflow"]
