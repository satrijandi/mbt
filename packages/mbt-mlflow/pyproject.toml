[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mbt-mlflow"
version = "0.1.0"
description = "MLflow tracking and registry adapters for mbt"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "mbt-adapter-base>=0.1.0,<0.2",
    "mlflow>=2.9",
]

[project.entry-points."mbt.adapters"]
mlflow = "mbt_mlflow.plugin:PLUGIN"

[tool.hatch.build.targets.wheel]
packages = ["src/mbt_mlflow"]
