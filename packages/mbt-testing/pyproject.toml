[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mbt-testing"
version = "0.1.0"
description = "Fake, contract-conformant mbt adapters for testing mbt projects and mbt itself"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Nugroho Satrijandi", email = "satrijandi@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "mbt-core>=0.1.0,<0.2",
    "mbt-adapter-base>=0.1.0,<0.2",
]

[project.urls]
Homepage = "https://github.com/satrijandi/mbt"
Documentation = "https://satrijandi.github.io/mbt/"
Repository = "https://github.com/satrijandi/mbt"
Issues = "https://github.com/satrijandi/mbt/issues"

[project.entry-points."mbt.adapters"]
fake = "mbt_testing.plugin:PLUGIN"

[tool.hatch.build.targets.wheel]
packages = ["src/mbt_testing"]
