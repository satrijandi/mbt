[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mbt-xgboost"
version = "0.1.0"
description = "XGBoost training adapter for mbt"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Nugroho Satrijandi", email = "satrijandi@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "mbt-adapter-base[metrics]>=0.1.0,<0.2",
    "xgboost>=2.0",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/satrijandi/mbt"
Documentation = "https://satrijandi.github.io/mbt/"
Repository = "https://github.com/satrijandi/mbt"
Issues = "https://github.com/satrijandi/mbt/issues"

[project.optional-dependencies]
onnx = ["onnxmltools>=1.12", "onnx>=1.15"]

[project.entry-points."mbt.adapters"]
xgboost = "mbt_xgboost.plugin:PLUGIN"

[tool.hatch.build.targets.wheel]
packages = ["src/mbt_xgboost"]
