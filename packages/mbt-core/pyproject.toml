[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mbt-core"
version = "0.1.0"
description = "mbt: a declarative build tool for machine learning models (dbt for ML)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Nugroho Satrijandi", email = "satrijandi@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "mbt-adapter-base>=0.1.0,<0.2",
    # 0.16: first release that parses PEP 604 unions (Path | None) AND works
    # with click >= 8.2 (make_metavar signature change).
    "typer>=0.16",
    # cli/main.py imports real click directly (its exception taxonomy is caught
    # alongside typer's vendored copy); typer >= 0.20 VENDORS click, so it no
    # longer arrives transitively - undeclared, a standalone install crashes at
    # `import click` (caught by the per-package wheel closure test, F7).
    # Two independent bars, whichever is higher. 8.2 is the first line whose
    # CliRunner captures stderr separately, which the CLI test surface reads on
    # every error-path assertion (8.1 needs CliRunner(mix_stderr=False) and 8.2
    # REMOVED that kwarg, so supporting both means version-sniffing the harness
    # to keep a click nobody is on). 8.3.3 is the first clear of PYSEC-2026-2132.
    # Was declared 8.1 with a comment claiming the floors job tested that bound;
    # the job resolved highest, so nothing ever did - see scripts/install_floors.py.
    "click>=8.3.3",
    "rich>=13.7",
    "pydantic>=2.7",
    # 3.1.6: clears the sandbox-escape chain (PYSEC-2026-1471/2/3/4/5). Every
    # floor below is a version the floors audit refuses to ship.
    "jinja2>=3.1.6",
    "networkx>=3.2",
    # 1.2: first release parsing `SELECT * RENAME (...)`, which the local
    # adapter emits for every label-offset join (adapters/local/data.py). On
    # 1.0/1.1 that is a ParserException at build time, so the old `>=1.0` was
    # not a conservative bound but a broken install a user could actually get.
    "duckdb>=1.2",
    "pyarrow>=23.0.1",  # 23.0.1 clears PYSEC-2026-113 (15.0 also carries PYSEC-2024-161)
    "PyYAML>=6.0",
    "packaging>=23.0",
]

[project.urls]
Homepage = "https://github.com/satrijandi/mbt"
Documentation = "https://satrijandi.github.io/mbt/"
Repository = "https://github.com/satrijandi/mbt"
Issues = "https://github.com/satrijandi/mbt/issues"

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
otel = ["opentelemetry-api>=1.24", "opentelemetry-sdk>=1.24"]
iceberg = ["pyiceberg>=0.6"]

[project.scripts]
mbt = "mbt.cli.main:main"

[project.entry-points."mbt.adapters"]
local = "mbt.adapters.local.plugin:PLUGIN"

[tool.hatch.build.targets.wheel]
packages = ["src/mbt"]
