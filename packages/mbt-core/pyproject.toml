[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mbt-core"
version = "0.1.0"
description = "mbt: a declarative build tool for machine learning models (dbt for ML)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Nugroho Satrijandi", email = "satrijandi@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "mbt-adapter-base>=0.1.0,<0.2",
    # 0.16: first release that parses PEP 604 unions (Path | None) AND works
    # with click >= 8.2 (make_metavar signature change).
    "typer>=0.16",
    "rich>=13.7",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "networkx>=3.2",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "PyYAML>=6.0",
    "packaging>=23.0",
]

[project.urls]
Homepage = "https://github.com/satrijandi/mbt"
Documentation = "https://satrijandi.github.io/mbt/"
Repository = "https://github.com/satrijandi/mbt"
Issues = "https://github.com/satrijandi/mbt/issues"

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
otel = ["opentelemetry-api>=1.24", "opentelemetry-sdk>=1.24"]
iceberg = ["pyiceberg>=0.6"]

[project.scripts]
mbt = "mbt.cli.main:main"

[project.entry-points."mbt.adapters"]
local = "mbt.adapters.local.plugin:PLUGIN"

[tool.hatch.build.targets.wheel]
packages = ["src/mbt"]
