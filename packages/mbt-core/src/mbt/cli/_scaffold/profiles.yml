# Environments for __PROJECT_NAME__. This file is COMMITTED: it is environment
# config as code, and CI has no other way to learn what `dev` and `prod` mean
# (a gitignored copy makes every workflow after `mbt parse` fail with "no
# profiles.yml found"). Never write a secret value here - resolve them via
# env_var('NAME') Jinja calls, which keeps the value out of the file and
# redacts it everywhere it could be printed.
#
# env_var() marks the value SECRET: it is redacted from every log line, event,
# manifest, model card, and run_results.json. Use env() for the environment
# values that are not secrets (roots, hosts, schema names) so they stay
# readable when you are debugging. See docs/spec-reference.md.
#
# Only training logs to the tracker (ADR-28): `mbt score` writes to the
# prediction store and `mbt monitor` to the ground-truth ledger, both read
# back with `mbt predictions show`. The experiment is named
# <project>_<experiment>, or the project name alone when `experiment:` is
# omitted below; each run is named <run_id>-<model>, so re-training does not
# produce a second run with the same name.
__PROJECT_NAME__:
  target: dev
  outputs:
    dev:
      data: {adapter: local, config: {root: .}}
      tracking: {adapter: mlflow, config: {uri: "sqlite:///mlflow.db"}}
      registry: {adapter: mlflow, config: {uri: "sqlite:///mlflow.db"}}
      compute: {adapter: local}
      artifact_store: file://./target/artifacts
      vars:
        # Dev/PR builds train on half the data: cheap by construction, and
        # the sampling is reproducible (seeded by the manifest identity).
        sample_fraction: 0.5
        max_tuning_trials: 5
    prod:
      data: {adapter: local, config: {root: "{{ env('MBT_DATA_ROOT', '.') }}"}}
      tracking: {adapter: mlflow, config: {uri: "{{ env('MLFLOW_TRACKING_URI', 'sqlite:///mlflow.db') }}"}}
      registry: {adapter: mlflow, config: {uri: "{{ env('MLFLOW_TRACKING_URI', 'sqlite:///mlflow.db') }}"}}
      compute: {adapter: local}
      artifact_store: file://./target/artifacts
      threads: 4
      vars:
        sample_fraction: 1.0
        max_tuning_trials: 50
