# mbt reference promotion workflow (FR-REG-03, FR-STATE-04): pure GitOps via
# a reviewed promotions.yml change, or a manually approved dispatch.
name: mbt promote

on:
  push:
    branches: [main]
    paths: [promotions.yml]
  workflow_dispatch:
    inputs:
      model:
        description: Registered model name
        required: true
      version:
        description: "Version to promote (default: latest in staging)"
        required: false
      to:
        description: Target stage
        required: true
        default: production

permissions:
  contents: read   # least privilege at workflow scope; jobs opt up individually

# Promotion mutates the registry; serialize and never cancel a run mid-write.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production   # require reviewers in repo settings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: "3.11"
      - name: Install project
        run: pip install -r requirements.txt
      - name: Promote (GitOps file)
        if: github.event_name == 'push'
        run: mbt promote --from-file promotions.yml
      - name: Promote (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        # Inputs arrive as env vars, never spliced into the script text. A
        # `${{ }}` expression is substituted BEFORE bash sees the line, so a
        # version of `1 --force` used to render `--version 1 --force` - and
        # --force is the documented override for "gates were not recorded as
        # passed", on the workflow whose whole purpose is enforcing that gate.
        # Quoting is not enough either: the quotes are part of the template,
        # so an input containing one breaks out of them.
        env:
          MODEL: ${{ inputs.model }}
          TO: ${{ inputs.to }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            mbt promote --model "$MODEL" --to "$TO" --version "$VERSION"
          else
            mbt promote --model "$MODEL" --to "$TO"
          fi
