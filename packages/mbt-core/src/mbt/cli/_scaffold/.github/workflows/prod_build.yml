# mbt reference prod build (FR-STATE-04): on merge to main, build the
# modified subgraph against prod and publish the manifest as latest.
name: mbt prod build

on:
  push:
    branches: [main]

permissions:
  contents: read   # least privilege at workflow scope; the job below opts up

env:
  MBT_STATE_URI: state/prod/latest.json

# Serialize prod builds: overlapping runs both publish the state baseline, so
# never cancel one in flight - queue the next instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prod-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Only this job writes, and only in its last two steps: the mbt-state
      # branch push and the manifest artifact upload.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          pip install -r requirements.txt
          python scripts/generate_sample_data.py
      - name: Restore prod state baseline (mbt-state branch)
        id: state
        run: |
          if bash scripts/fetch_state.sh "$MBT_STATE_URI"; then
            echo "have_state=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_state=false" >> "$GITHUB_OUTPUT"
            echo "No prod baseline yet; building everything (bootstrap)."
          fi
      - name: Build (prod target)
        # --deep-snapshot: the published baseline must use content-hash
        # tokens, or the next fresh checkout's mtimes would flag every
        # dataset as modified and retrain the world (ADR-11).
        env:
          HAVE_STATE: ${{ steps.state.outputs.have_state }}
        run: |
          if [ "$HAVE_STATE" = "true" ]; then
            mbt build --target prod --deep-snapshot --select state:modified+ --state "$MBT_STATE_URI"
          else
            mbt build --target prod --deep-snapshot
          fi
      - name: Publish manifest as the new baseline (FR-STATE-03)
        # Durable out of the box: an append-only mbt-state branch (needs the
        # `contents: write` permission above, immune to main's branch
        # protection, history = audit trail of every published baseline).
        # Real setups can swap both state steps for the s3 layout instead:
        #   aws s3 cp target/manifest.json s3://<bucket>/mbt/<project>/prod/manifests/latest.json
        run: bash scripts/publish_state.sh target/manifest.json
      - name: Upload manifest artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: mbt-manifest-${{ github.sha }}
          path: target/manifest.json
      - name: Alert on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.MBT_ALERT_WEBHOOK }}
        run: |
          [ -z "$WEBHOOK" ] && { echo "MBT_ALERT_WEBHOOK not set; skipping alert"; exit 0; }
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"mbt prod build failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$WEBHOOK"
