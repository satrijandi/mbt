# mbt scheduled retraining (FR-STATE-06): CI cron + tag selection.
# The monthly companion to scheduled_retrain.yml, for slow-moving models.
# It ships switched OFF: tag a model `monthly` in its spec, then set the repo
# variable MBT_MONTHLY_RETRAIN to `enabled`. A selector that matches no model
# is an error (exit 1), not a no-op - otherwise a renamed tag would retrain
# nothing every month while the heartbeat below reported success - so running
# this before any model carries the tag would fail on schedule.
name: mbt monthly retrain

on:
  schedule:
    - cron: "0 4 1 * *"  # 1st of month 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read   # least privilege at workflow scope; jobs opt up individually

# Serialize runs: a slow retrain still going when the next cron fires would
# race to publish the champion/state baseline, so queue instead of cancelling.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  retrain:
    if: vars.MBT_MONTHLY_RETRAIN == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: "3.11"
      - name: Install project
        # No generate_sample_data.py here: that is pr_check's dev data. The
        # prod target reads real data from MBT_DATA_ROOT (next step).
        run: pip install -r requirements.txt
      - name: Point the prod target at the real data
        # profiles.yml's prod target reads env('MBT_DATA_ROOT') with NO default,
        # so a run without it fails loudly instead of training, registering and
        # scoring whatever happens to sit in the checkout. Set the repo variable
        # MBT_DATA_ROOT (README, "Repo settings this project assumes"). Exported
        # only when set: GitHub renders an unset variable as an empty string,
        # which would read as a real - empty - root.
        env:
          DATA_ROOT: ${{ vars.MBT_DATA_ROOT }}
        run: |
          if [ -n "$DATA_ROOT" ]; then echo "MBT_DATA_ROOT=$DATA_ROOT" >> "$GITHUB_ENV"; fi
      - name: Retrain monthly models (prod target)
        run: mbt build --target prod --select tag:monthly
      - name: Heartbeat on success
        # Dead-man's-switch: ping a cron-monitor (healthchecks.io, Cronitor, ...)
        # so a schedule that silently stops - a mis-set cron, or GitHub disabling
        # the workflow after 60 days of repo inactivity - is caught by the
        # missing ping. Set the MBT_HEARTBEAT_URL secret to enable.
        if: success()
        env:
          HEARTBEAT_URL: ${{ secrets.MBT_HEARTBEAT_URL }}
        run: |
          [ -z "$HEARTBEAT_URL" ] && { echo "MBT_HEARTBEAT_URL not set; skipping heartbeat"; exit 0; }
          curl -fsS -m 10 --retry 3 "$HEARTBEAT_URL" || echo "heartbeat ping failed; the dead-man's-switch will alert on the missing ping"
      - name: Alert on failure
        # A silently failed scheduled retrain violates continuous training;
        # set the MBT_ALERT_WEBHOOK secret (Slack/Teams/PagerDuty webhook).
        if: failure()
        env:
          WEBHOOK: ${{ secrets.MBT_ALERT_WEBHOOK }}
        run: |
          [ -z "$WEBHOOK" ] && { echo "MBT_ALERT_WEBHOOK not set; skipping alert"; exit 0; }
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"mbt scheduled retrain failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$WEBHOOK"
