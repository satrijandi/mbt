# mbt reference PR check (FR-STATE-04/05): parse -> compile -> state diff ->
# build the modified subgraph on the dev target -> post a PR comment.
name: mbt PR check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  # Local path where the prod baseline (mbt-state branch) materializes for
  # --state. Real setups can point this straight at
  # s3://<bucket>/mbt/<project>/prod/manifests/latest.json and drop the
  # fetch step (FR-STATE-03).
  MBT_STATE_URI: state/prod/latest.json

# A new push to the same PR cancels the in-flight check (matches the mbt repo's
# own CI hardening). The state-mutating workflows queue instead of cancelling.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          pip install -r requirements.txt
          python scripts/generate_sample_data.py
      - name: Parse and compile
        run: |
          mbt parse
          # --deep-snapshot everywhere in CI: fresh checkouts rewrite mtimes,
          # so the default mtime snapshots would flag every dataset as
          # modified on every run (ADR-11). One token scheme, both sides.
          mbt compile --target dev --deep-snapshot
      - name: Restore prod state baseline (mbt-state branch)
        id: state
        run: |
          if bash scripts/fetch_state.sh "$MBT_STATE_URI"; then
            echo "have_state=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_state=false" >> "$GITHUB_OUTPUT"
            echo "No prod baseline yet; building everything (bootstrap)."
          fi
      - name: State diff
        if: steps.state.outputs.have_state == 'true'
        run: |
          mbt state diff --state "$MBT_STATE_URI" --deep-snapshot --output json > target/state_diff.json
          cat target/state_diff.json
      - name: Build modified subgraph (dev target)
        run: |
          if [ "${{ steps.state.outputs.have_state }}" = "true" ]; then
            mbt build --target dev --deep-snapshot --select state:modified+ --state "$MBT_STATE_URI"
          else
            mbt build --target dev --deep-snapshot
          fi
      - name: Post PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./scripts/pr_comment.js')
            await script({github, context, core})
