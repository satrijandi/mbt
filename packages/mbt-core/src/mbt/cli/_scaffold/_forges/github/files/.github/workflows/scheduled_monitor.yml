# mbt scheduled ground-truth monitoring (ADR-21): evaluate matured
# predictions against arrived labels; each prediction run is evaluated
# exactly once (ledger markers in the prediction store).
name: mbt weekly ground-truth monitor

on:
  schedule:
    - cron: "0 7 * * 1"  # Mondays 07:00 UTC
  workflow_dispatch:
    inputs:
      anchor:
        description: "ISO timestamp to run as of (default: today 07:00 UTC)"
        required: false
        default: ""

permissions:
  contents: read   # least privilege at workflow scope; jobs opt up individually

# Serialize runs: two overlapping monitor crons would both see a run as
# unevaluated and double-evaluate/double-alert it, so queue instead of cancel.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read   # the anchor step reads this run's created_at
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: "3.11"
      - name: Install project
        # No generate_sample_data.py here: that is pr_check's dev data. The
        # prod target reads real data from MBT_DATA_ROOT (next step).
        run: pip install -r requirements.txt
      - name: Point the prod target at the real data
        # profiles.yml's prod target reads env('MBT_DATA_ROOT') with NO default,
        # so a run without it fails loudly instead of training, registering and
        # scoring whatever happens to sit in the checkout. Set the repo variable
        # MBT_DATA_ROOT (README, "Repo settings this project assumes"). Exported
        # only when set: GitHub renders an unset variable as an empty string,
        # which would read as a real - empty - root.
        env:
          DATA_ROOT: ${{ vars.MBT_DATA_ROOT }}
        run: |
          if [ -n "$DATA_ROOT" ]; then echo "MBT_DATA_ROOT=$DATA_ROOT" >> "$GITHUB_ENV"; fi
      - name: Pin the anchor to this run's scheduled slot
        # Without --anchor every invocation compiles against "now": the window
        # moves by seconds, ADR-21's run key (a hash of the resolved windows)
        # changes, and GitHub's "Re-run jobs" writes the same day's work twice.
        # A run's created_at survives a re-run, and truncating it to the cron's
        # 07:00 UTC slot also absorbs GitHub's scheduling delay - keep the time
        # here in step with the cron above. A manual dispatch may pass its own.
        id: anchor
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.anchor }}
        run: |
          if [ -n "$REQUESTED" ]; then
            anchor="$REQUESTED"
          else
            created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
            anchor="${created%%T*}T07:00:00Z"
          fi
          echo "anchor=$anchor" >> "$GITHUB_OUTPUT"
      - name: Evaluate matured predictions (prod target)
        id: mbt
        env:
          ANCHOR: ${{ steps.anchor.outputs.anchor }}
        run: |
          set +e
          mbt monitor --target prod --deep-snapshot --anchor "$ANCHOR"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Exit 2 = a realized-metric gate breached: a completed run that reached
          # a decision, NOT an outage. The heartbeat below still pings (the
          # schedule is alive) and the alert pages on the breach; only a hard
          # error (exit 1) or a crash should trip the dead-man's-switch, so
          # re-raise just that (F11).
          [ "$code" -eq 2 ] && exit 0
          exit "$code"
      - name: Heartbeat on a completed run
        # Dead-man's-switch: ping a cron-monitor (healthchecks.io, Cronitor, ...)
        # so a schedule that silently stops - a mis-set cron, or GitHub disabling
        # the workflow after 60 days of repo inactivity - is caught by the missing
        # ping. A quality breach (exit 2) is a completed run, so it still pings;
        # only exit 1 or a no-show trips the switch. Set MBT_HEARTBEAT_URL.
        if: success()
        env:
          HEARTBEAT_URL: ${{ secrets.MBT_HEARTBEAT_URL }}
        run: |
          [ -z "$HEARTBEAT_URL" ] && { echo "MBT_HEARTBEAT_URL not set; skipping heartbeat"; exit 0; }
          curl -fsS -m 10 --retry 3 "$HEARTBEAT_URL" || echo "heartbeat ping failed; the dead-man's-switch will alert on the missing ping"
      - name: Alert on a quality breach
        # Exit 2 = a realized-metric gate failed: the model is underperforming in
        # production. A hard error (exit 1) is left to the dead-man's-switch above,
        # so it is not double-paged here (F11). Set the MBT_ALERT_WEBHOOK secret.
        if: "steps.mbt.outputs.exit_code == '2'"
        env:
          WEBHOOK: ${{ secrets.MBT_ALERT_WEBHOOK }}
        run: |
          [ -z "$WEBHOOK" ] && { echo "MBT_ALERT_WEBHOOK not set; skipping alert"; exit 0; }
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"mbt ground-truth monitor breach: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$WEBHOOK"
