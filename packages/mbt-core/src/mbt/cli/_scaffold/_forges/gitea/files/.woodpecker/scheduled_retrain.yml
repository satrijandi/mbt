# mbt scheduled retraining on Woodpecker CI (FR-STATE-06): a cron + tag
# selection. No orchestrator concept needed - freshness arrives as new
# snapshots.
#
# Runs from the repo's `weekly-retrain` cron (Mondays 05:00 UTC: "0 5 * * 1"; README,
# "Repo settings this project assumes"), or by hand: "Run pipeline" on main
# with the pipeline variable MBT_SCHEDULE=weekly-retrain. Secrets: mbt_data_root,
# mbt_heartbeat_url and mbt_alert_webhook (`disabled` turns either off).
when:
  - event: cron
    cron: weekly-retrain
  - event: manual
    branch: main
    evaluate: 'MBT_SCHEDULE == "weekly-retrain"'

steps:
  - name: retrain
    image: python:3.11-bookworm@sha256:5887f265d8d44d8b4734d3658b21d668edf5aaf92e4945bc0c984afbfab105d3
    environment:
      MBT_DATA_ROOT:
        from_secret: mbt_data_root
    commands:
      - pip install -r requirements.txt
      - mbt build --target prod --select tag:weekly

  - name: heartbeat
    # Dead-man's-switch: ping a cron monitor (healthchecks.io, Cronitor, ...)
    # so a schedule that silently stops - a deleted cron, an agent that is
    # gone - is caught by the missing ping.
    image: python:3.11-bookworm@sha256:5887f265d8d44d8b4734d3658b21d668edf5aaf92e4945bc0c984afbfab105d3
    when:
      - status: success
    environment:
      MBT_HEARTBEAT_URL:
        from_secret: mbt_heartbeat_url
    commands:
      - bash scripts/ci_notify.sh heartbeat

  - name: alert
    # A silently failed scheduled retrain violates continuous training.
    image: python:3.11-bookworm@sha256:5887f265d8d44d8b4734d3658b21d668edf5aaf92e4945bc0c984afbfab105d3
    when:
      - status: failure
    environment:
      MBT_ALERT_WEBHOOK:
        from_secret: mbt_alert_webhook
    commands:
      - bash scripts/ci_notify.sh alert "mbt scheduled weekly retrain failed"
