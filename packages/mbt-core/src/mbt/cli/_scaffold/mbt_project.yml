# yaml-language-server: $schema=./target/json-schemas/mbt_project.schema.json
name: __PROJECT_NAME__
version: "0.1.0"

# Vars usable in specs via {{ var('...') }}; targets may override them.
vars:
  # A gate below the base rate never gates. The sample data is ~22% positive
  # (random-baseline PR-AUC ~0.22) and the model scores ~0.32, so this floor
  # sits meaningfully above chance with headroom to spare; raise it as your
  # real model improves.
  pr_auc_floor: 0.25

model_defaults:
  adapter: xgboost
