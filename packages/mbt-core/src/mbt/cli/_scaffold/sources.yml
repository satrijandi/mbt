# yaml-language-server: $schema=./target/json-schemas/sources.schema.json
sources:
  - name: lakehouse
    description: Local parquet stand-in for your warehouse gold layer.
    tables:
      - name: subscribers
        path: data/subscribers/*.parquet
        description: One row per subscriber per monthly snapshot.
      - name: scoring_batch
        path: data/scoring_batch/*.parquet
        description: Fresh unlabeled subscribers to score nightly.
      - name: churn_outcomes
        path: data/churn_outcomes/*.parquet
        description: Realized churn outcomes, arriving ~90 days after scoring.
