[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mbt-h2o"
version = "0.1.0"
description = "H2O AutoML training adapter for mbt (local backend + optional Sparkling Water)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Nugroho Satrijandi", email = "satrijandi@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "mbt-adapter-base[metrics]>=0.1.0,<0.2",
    # Ceiling, not a stale pin. h2o 3.46.0.12 (2026-08-12) moved MOJO export
    # behind H2O-3 Secure, its commercial tier: `download_mojo` now raises
    # unconditionally via h2o/enterprise.py, and that is precisely what this
    # adapter's native export calls, so the whole export/load path dies. That
    # release is also sdist-only (a 266MB source build). Without this ceiling a
    # fresh `pip install mbt-h2o` resolves it and breaks; uv.lock pins
    # 3.46.0.11 so CI would never warn us.
    # Lift only once a release restores MOJO to the OSS tier - the e2e H2O
    # compliance module is what proves it (22 passed on 3.46.0.11, 4 of those
    # plus the h2o/spark loop fail on 3.46.0.12).
    "h2o>=3.46,<3.46.0.12",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/satrijandi/mbt"
Documentation = "https://satrijandi.github.io/mbt/"
Repository = "https://github.com/satrijandi/mbt"
Issues = "https://github.com/satrijandi/mbt/issues"

[project.optional-dependencies]
# H2O distributed on Spark executors; version-locked to the Spark minor.
sparkling = ["h2o-pysparkling-3.5>=3.46", "pyspark>=3.5,<3.6"]

[project.entry-points."mbt.adapters"]
h2o_automl = "mbt_h2o.plugin:PLUGIN"

[tool.hatch.build.targets.wheel]
packages = ["src/mbt_h2o"]
