[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mbt-sklearn"
version = "0.1.0"
description = "scikit-learn training adapter for mbt"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Nugroho Satrijandi", email = "satrijandi@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    # [metrics] already pulls scikit-learn, so this adapter adds no new
    # dependency to an mbt install that computes metrics at all - which is
    # every install. The floor is the same 1.5 (clears PYSEC-2024-110).
    "mbt-adapter-base[metrics]>=0.1.0,<0.2",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    # Declared even though scikit-learn already requires it: this adapter
    # imports joblib directly for artifact export, and the floors job only
    # tests bounds that are declared.
    "joblib>=1.3",
]

[project.urls]
Homepage = "https://github.com/satrijandi/mbt"
Documentation = "https://satrijandi.github.io/mbt/"
Repository = "https://github.com/satrijandi/mbt"
Issues = "https://github.com/satrijandi/mbt/issues"

[project.entry-points."mbt.adapters"]
sklearn = "mbt_sklearn.plugin:PLUGIN"

[tool.hatch.build.targets.wheel]
packages = ["src/mbt_sklearn"]
