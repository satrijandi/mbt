datasets:
  # Identical wide multi-table shape to examples/snowflake_wide - only the data
  # source differs (S3 parquet via Spark instead of Snowflake tables). A
  # population spine, a label table, and three feature tables, ALL joined on
  # [customer_id, snapshot_date] (ADR-22).
  - name: wide_churn_training
    description: Monthly churn panel from population + labels + three feature tables.
    inputs:
      population: source('lake', 'customer_population')
      label:
        source: source('lake', 'churn_labels')
        using: [customer_id, snapshot_date]
      features:
        - source: source('lake', 'demographic_features')
          using: [customer_id, snapshot_date]
        - source: source('lake', 'engagement_features')
          using: [customer_id, snapshot_date]
        - source: source('lake', 'billing_features')
          using: [customer_id, snapshot_date]
      join_key: [customer_id, snapshot_date]
    label:
      column: is_churn
    split:
      strategy: temporal
      time_column: snapshot_date
      train: "2026-01-01:2026-03-01"
      test: "2026-03-01:2026-05-01"
    checks:
      - class_balance_report
      - not_null:
          columns: [is_churn, customer_id, snapshot_date]
    tags: [churn, wide, s3]
