sources:
  # One source group ("lake"); each table uses `path:` (a parquet glob relative
  # to the profile's `root: s3://my-lake`, so it resolves to
  # s3://my-lake/<path>). Point `root` at your bucket and adjust these globs.
  - name: lake
    description: Parquet population, label, and feature tables in an S3 lake.
    tables:
      - name: customer_population
        path: customer_population/*.parquet
        description: One row per active customer per monthly snapshot - the spine (ADR-22).
      - name: churn_labels
        path: churn_labels/*.parquet
        description: Churn outcome per (customer_id, snapshot_date).
      - name: demographic_features
        path: demographic_features/*.parquet
        description: Demographic attributes per (customer_id, snapshot_date).
      - name: engagement_features
        path: engagement_features/*.parquet
        description: Product-engagement metrics per (customer_id, snapshot_date).
      - name: billing_features
        path: billing_features/*.parquet
        description: Billing and plan metrics per (customer_id, snapshot_date).
