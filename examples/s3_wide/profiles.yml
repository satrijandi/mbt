# The profile key must match `name` in mbt_project.yml.
# S3 is read through the Spark data adapter over s3a: `root` is the bucket, and
# `conf` carries the Hadoop s3a settings. Credentials/endpoint come from the
# environment (never commit them) - see README.md.
s3_wide:
  target: prod
  outputs:
    prod:
      data:
        adapter: spark
        config:
          master: local[*]
          root: s3://my-lake                    # bucket holding the parquet tables
          conf:
            spark.hadoop.fs.s3.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
            spark.hadoop.fs.s3a.endpoint: "{{ env_var('AWS_S3_ENDPOINT', 's3.amazonaws.com') }}"
            spark.hadoop.fs.s3a.path.style.access: "true"
            # true for real AWS S3; set false for plain-HTTP MinIO/SeaweedFS.
            spark.hadoop.fs.s3a.connection.ssl.enabled: "{{ env_var('AWS_S3_SSL', 'true') }}"
            spark.hadoop.fs.s3a.access.key: "{{ env_var('AWS_ACCESS_KEY_ID') }}"
            spark.hadoop.fs.s3a.secret.key: "{{ env_var('AWS_SECRET_ACCESS_KEY') }}"
      # Tracking + registry stay local so the example needs no extra infra.
      tracking: {adapter: mlflow, config: {uri: "sqlite:///mlflow.db"}}
      registry: {adapter: mlflow, config: {uri: "sqlite:///mlflow.db"}}
      compute: {adapter: local}
      artifact_store: file://./target/artifacts
      threads: 2
      vars:
        sample_fraction: 1.0
        max_tuning_trials: 3
