scoring:
  # The serving half of the wide shape (ADR-20/22/23): the SAME population
  # spine and three feature tables the training dataset declares, minus the
  # label - scoring inputs are unlabeled by design. The join pushes down to
  # one Snowflake query; only the scored cohort leaves the warehouse.
  - name: wide_churn_scoring
    description: Month-start churn scores for the newest population cohort.
    owner: ml-team@example.com
    tags: [churn, wide, snowflake]

    model: ref('churn_wide')
    # The champion is resolved from the registry at run time, so promotions
    # take effect on the next scheduled run without a spec edit. `staging`
    # matches the model's stage_on_pass, letting the demo loop run right
    # after `mbt build`; a promoted production setup would say `production`.
    stage: staging

    input:
      # Same column convention as training: every table joins on the shared
      # customer_id + snapshot_date keys (present in the population table).
      # The champion applies its training-time feature list, so the join
      # keys are never scored as features; here they pass through as the
      # identity columns declared under output.columns.
      inputs:
        spine: source('snowflake', 'customer_population')
        features:
          - source: source('snowflake', 'demographic_features')
            using: [customer_id, snapshot_date]
          - source: source('snowflake', 'engagement_features')
            using: [customer_id, snapshot_date]
          - source: source('snowflake', 'billing_features')
            using: [customer_id, snapshot_date]
        join_key: [customer_id, snapshot_date]
      time_column: snapshot_date
      # Exactly the newest month-start cohort, resolved against the run's
      # --anchor (snapshot-driven, never clock-driven): anchored at
      # 2026-06-01 this scores the 2026-05-01 snapshot.
      window: "-31d:now"
      sample_key: [customer_id]

    checks:
      - not_null:
          columns: [customer_id, snapshot_date]

    # Drift tripwires evaluated on every scoring run, against the champion's
    # training-time baselines (ADR-20).
    monitors:
      feature_shift:
        threshold: 0.25
      prediction_shift:
        threshold: 0.25

    # Delayed realized metrics (ADR-21): churn outcomes arrive in the label
    # table about a month after the snapshot. `mbt monitor` evaluates each
    # prediction run once its scored_at + maturity lies at or before the
    # monitor anchor.
    ground_truth:
      label:
        source: source('snowflake', 'churn_labels')
        column: is_churn
      join_key: [customer_id, snapshot_date]
      maturity: "30d"
      metrics: [pr_auc, roc_auc]
      gates:
        - metric: pr_auc
          threshold: "{{ var('pr_auc_floor') }}"

    output:
      # Joined with the data adapter's predictions_root (ADR-23 v1 stages
      # parquet there; the warehouse-native store is ADR-23 v2).
      path: wide_churn_scores
      columns: [customer_id, snapshot_date]
