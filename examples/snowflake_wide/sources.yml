sources:
  # One source group ("snowflake"); each table uses `identifier:` (not `path:`),
  # qualified as [DB.][SCHEMA.]TABLE - bare names inherit database/schema from
  # the profile's snowflake config; fully qualified names (GOLD.DS.MY_TABLE)
  # override it, so read-only source schemas work as-is.
  #
  # COLUMN CONVENTION (the contract this project assumes):
  # - Every table carries the SAME two join columns, identically named:
  #   customer_id (entity) + snapshot_date (month-start snapshot).
  # - The population table holds ALL required join keys and NOTHING else;
  #   it decides which (customer, snapshot) rows exist (ADR-22).
  # - Everything else in a feature table is treated as a candidate feature.
  #   Columns to IGNORE as features are declared ONCE, in
  #   models/churn_wide.yml `features.exclude` (join keys are excluded there;
  #   add any bookkeeping columns your real tables carry, e.g. etl_loaded_at).
  - name: snowflake
    description: Gold-layer population, label, and feature tables in Snowflake.
    tables:
      - name: customer_population
        identifier: CUSTOMER_POPULATION
        description: >-
          The spine (ADR-22). Columns: customer_id + snapshot_date - the join
          keys only, nothing else. Every other table joins onto these.
      - name: churn_labels
        identifier: CHURN_LABELS
        description: >-
          Join: customer_id + snapshot_date. Payload: is_churn (the training
          target - never a feature; its join columns are projected away).
      - name: demographic_features
        identifier: DEMOGRAPHIC_FEATURES
        description: >-
          Join: customer_id + snapshot_date. Features: age, tenure_months.
      - name: engagement_features
        identifier: ENGAGEMENT_FEATURES
        description: >-
          Join: customer_id + snapshot_date. Features: logins_30d,
          avg_session_min. Carries extra mid-month snapshot rows that the
          exact-key join ignores.
      - name: billing_features
        identifier: BILLING_FEATURES
        description: >-
          Join: customer_id + snapshot_date. Features: monthly_spend,
          plan_tier. Also carries etl_loaded_at bookkeeping, pruned at the
          source by the specs' per-table exclude (ADR-25).
