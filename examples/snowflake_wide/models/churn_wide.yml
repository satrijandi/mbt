models:
  - name: churn_wide
    description: XGBoost churn model over the wide multi-table Snowflake panel.
    task: binary_classification
    adapter: xgboost
    owner: ml-team@example.com
    tags: [churn, wide, snowflake]

    dataset: ref('wide_churn_training')

    target: is_churn
    # THE ignore list: every column of the joined panel is a candidate
    # feature except the target (excluded automatically) and what is listed
    # here. The join keys are identity, not signal; with real tables, add
    # any bookkeeping columns they carry (load timestamps, batch ids, ...).
    features:
      include: ["*"]
      exclude: [customer_id, snapshot_date]

    evaluation:
      protocol: {split: temporal}
      metrics: [pr_auc, roc_auc]
      gates:
        - metric: pr_auc
          threshold: "{{ var('pr_auc_floor') }}"

    registration:
      name: churn_wide
      stage_on_pass: staging
    seed: 42
