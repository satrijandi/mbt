models:
  - name: churn_classifier
    description: "90-day churn prediction for active subscribers"
    task: binary_classification
    adapter: xgboost
    owner: growth-ds@example.com
    tags: [churn, weekly]

    dataset: ref('churn_training_set')

    target: churned_90d
    features:
      include: ["*"]
      exclude: [user_id, upgraded_90d, plan_type, account_status]   # id, sibling label, post-outcome status

    hyperparameters:
      max_depth: 4
      learning_rate: 0.1
      n_estimators: 120
      scale_pos_weight: "{{ auto }}"

    evaluation:
      protocol: {split: temporal}
      # brier/ece: interventions consume the probabilities, so calibration
      # is first-class; threshold_at_precision_0.35 is the deployable score
      # cutoff for a 35%-precision outreach campaign (operating point).
      metrics: [pr_auc, roc_auc, logloss, brier, ece,
                threshold_at_precision_0.35, lift_at_0.1, campaign_capture_100]
      gates:
        - metric: pr_auc
          threshold: "{{ var('pr_auc_floor') }}"
      slices: [plan_type]

    registration:
      name: churn_classifier
      stage_on_pass: staging

    seed: 42
