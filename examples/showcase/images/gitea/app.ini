; The stock app.ini of upstream's rootless image (docker/rootless/etc/templates/
; app.ini, rendered with docker-setup.sh's defaults). The entrypoint copies it
; into place on first start and folds compose's GITEA__section__KEY variables
; into it on every start; Gitea itself writes its generated secrets back.
APP_NAME = Gitea: Git with a cup of tea
RUN_USER = git
RUN_MODE = prod

[repository]
ROOT = /var/lib/gitea/git/repositories

[repository.local]
LOCAL_COPY_PATH = /tmp/gitea/local-repo

[repository.upload]
TEMP_PATH = /tmp/gitea/uploads

[server]
APP_DATA_PATH = /var/lib/gitea
SSH_DOMAIN = localhost
HTTP_PORT = 3000
ROOT_URL =
DISABLE_SSH = false
; Only Gitea's internal ssh server runs in a rootless container
START_SSH_SERVER = true
SSH_PORT = 2222
SSH_LISTEN_PORT =
BUILTIN_SSH_SERVER_USER = git
LFS_START_SERVER =

[database]
PATH = /var/lib/gitea/data/gitea.db
DB_TYPE = sqlite3
HOST = localhost:3306
NAME = gitea
USER = root
PASSWD =

[session]
PROVIDER_CONFIG = /var/lib/gitea/data/sessions

[picture]
AVATAR_UPLOAD_PATH = /var/lib/gitea/data/avatars
REPOSITORY_AVATAR_UPLOAD_PATH = /var/lib/gitea/data/repo-avatars

[attachment]
PATH = /var/lib/gitea/data/attachments

[log]
ROOT_PATH = /var/lib/gitea/data/log

[security]
INSTALL_LOCK = false
SECRET_KEY =

[service]
DISABLE_REGISTRATION = false
REQUIRE_SIGNIN_VIEW = false

[lfs]
PATH = /var/lib/gitea/git/lfs
