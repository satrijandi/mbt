# One sources.yml serves BOTH data planes (DESIGN.md section 4.2):
# table paths are RELATIVE and each target's data adapter supplies the root -
# the spark targets use root s3://mbt-lake (the s3:// spelling is exempt from
# project-dir path resolution; fs.s3.impl maps it onto S3AFileSystem), and the
# prod_score target's local adapter uses root /workspace/lake_local.
sources:
  - name: lake
    description: Gold-layer feature tables on the SeaweedFS parquet lake.
    tables:
      - name: subscribers
        path: subscribers/*.parquet
        description: One row per subscriber per monthly snapshot.
      - name: scoring_batch
        path: scoring_batch/*.parquet
        description: Fresh unlabeled subscribers to score (last week before the anchor).
      - name: churn_outcomes
        path: churn_outcomes/*.parquet
        description: Realized churn outcomes, arriving ~90 days after scoring.
      - name: monthly_subscribers
        path: monthly_subscribers/*.parquet
        description: One row per subscriber per month-start snapshot, labeled with 30-day churn.
      - name: monthly_scoring_batch
        path: monthly_scoring_batch/*.parquet
        description: Fresh unlabeled subscribers at the newest month start.
      - name: monthly_churn_outcomes
        path: monthly_churn_outcomes/*.parquet
        description: Realized 30-day churn outcomes for the monthly batch, arriving ~30 days later.
      # The wide multi-table shape (ADR-22, docs/naming-conventions.md): a
      # population spine carrying the entity crosswalk, three feature
      # -history tables joined by DIFFERENT entity keys on the one uniform
      # inference_date, and matured labels keyed by the cohort's own
      # inference_date.
      - name: monthly_population
        path: monthly_population/*.parquet
        description: >-
          One row per active customer per month-start inference_date; carries the entity
          crosswalk (customer_id to safe_id), the informational as_of_date lineage column,
          and the loaded_at_time ingest audit column.
      - name: monthly_labels
        path: monthly_labels/*.parquet
        description: >-
          Matured churn outcomes keyed by (customer_id, inference_date) - the cohort's own
          prediction date; rows appear once the one-month outcome window closes.
      - name: demographic_history
        path: demographic_history/*.parquet
        description: Monthly demographic features keyed by (customer_id, inference_date); rows describe balances as of the previous day.
      - name: login_history
        path: login_history/*.parquet
        description: Monthly login-activity features keyed by (customer_id, inference_date); rows describe balances as of the previous day.
      - name: transaction_history
        path: transaction_history/*.parquet
        description: Monthly transaction features keyed by (safe_id, inference_date); rows describe balances as of the previous day.
      - name: wide_churn_outcomes
        path: wide_churn_outcomes/*.parquet
        description: Matured outcomes of the newest snapshot's cohort, for ground-truth monitoring.
