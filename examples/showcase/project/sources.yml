# The showcase's whole data model: ONE table, already in the lake.
#
# churn_panel is a gold-layer customer snapshot - one row per customer per
# month-start inference_date, carrying the population flag, every feature,
# and the label. The dataset, the scoring input, and the ground-truth labels
# all read it; they differ only in which rows they take (docs/showcase.md).
#
# The path is RELATIVE: every target's data adapter supplies root
# s3://mbt-lake (the s3:// spelling is exempt from project-dir path
# resolution; fs.s3.impl maps it onto S3AFileSystem). bootstrap/churn_panel.py
# is what puts it there, at whatever scale you ask for.
sources:
  - name: lake
    description: The SeaweedFS parquet lake.
    tables:
      - name: churn_panel
        path: churn_panel/*.parquet
        description: >-
          One row per customer per month-start inference_date: customer_id, the is_active
          population flag, named features, hundreds of unused noise columns, and is_churn
          (churned during the following month; NULL for inactive rows and for the newest
          cohort until its outcome window closes).
