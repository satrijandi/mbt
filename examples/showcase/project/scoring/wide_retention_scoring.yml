scoring:
  - name: wide_retention_scoring
    description: Month-start churn scores for the wide multi-table cadence.
    owner: lifecycle-eng@example.com
    tags: [wide]

    model: ref('churn_wide_automl')
    stage: production              # champion resolved from the registry at run time (ADR-20)

    input:
      # The serving twin of the training panel (ADR-29): the same upstream join,
      # minus the label and its INNER join, so the newest cohort survives.
      # Scoring used to restate the whole join here, with a comment warning that
      # it had to prune identically or the champion would meet columns it never
      # saw. Both sides now name one relation, and the champion's recorded
      # feature columns are enforced at score time rather than by copy-paste.
      # The two relations share one join definition upstream, which is the
      # dbt-side half of the same contract.
      source: source('lake', 'monthly_panel_scoring')
      time_column: inference_date
      # Exactly the newest month-start cohort, and no newer: ending the window
      # 28 days back rather than at `now` is also what makes the 14d maturity
      # below reach the 1mo label horizon (a row is already 28 days old when it
      # is scored, so 14 more days carries it past its outcome window).
      window: "-31d:-28d"
      sample_key: customer_id

    checks:
      - not_null:
          columns: [customer_id, safe_id, inference_date, as_of_date]

    monitors:
      feature_shift:
        threshold: 0.25
      prediction_shift:
        threshold: 0.25

    # Maturity counts from scored_at (the scoring run's anchor, 2026-06-30),
    # while the label horizon counts from inference_date - the input window
    # above is what bridges the two. The cohort's outcome window closes one
    # month after its inference_date (2026-07-01), so 14d models label-arrival
    # lag and matures inside the pinned monitor anchor (2026-07-14 <=
    # 2026-07-20).
    ground_truth:
      label:
        source: source('lake', 'wide_churn_outcomes')
        column: is_churn
      join_key: customer_id
      maturity: "14d"
      metrics: [pr_auc, roc_auc]
      gates:
        - metric: pr_auc
          threshold: "{{ var('wide_pr_auc_floor') }}"

    output:
      path: predictions/wide_retention_scores
      columns: [customer_id, inference_date]
