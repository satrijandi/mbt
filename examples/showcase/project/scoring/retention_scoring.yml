scoring:
  - name: retention_scoring
    description: Month-start churn scores feeding the retention campaign.
    owner: lifecycle-eng@example.com
    tags: [churn]

    model: ref('churn_automl')
    stage: production              # champion resolved from the registry at run time (ADR-20)

    input:
      # The SAME lake table the model trained on. Its is_churn column is
      # harmless here: a model's target is never one of its features, and the
      # prediction store keeps only output.columns + join keys + prediction.
      source: source('lake', 'churn_panel')
      # Same population the model trained on (see churn_training).
      filters:
        - "is_active = true"
      time_column: inference_date
      # Exactly the newest cohort (2026-06-01 at the pinned anchor
      # 2026-06-30), and no newer. Ending the window 28 days back rather than
      # at `now` is also what lets the 14d maturity below reach the 1mo label
      # horizon: a row is already 28 days old when it is scored.
      window: "-31d:-28d"
      sample_key: customer_id

    checks:
      - not_null:
          columns: [customer_id, inference_date]

    # Distribution shift vs the champion's training-time baseline (ADR-20);
    # a breach exits 2, like a failed gate.
    monitors:
      feature_shift:
        threshold: 0.25
      prediction_shift:
        threshold: 0.25

    # Realized metrics once outcomes land - again from the same table, whose
    # newest cohort gets its is_churn filled when the outcome window closes
    # (bootstrap/churn_panel.py land-outcomes). The join key MUST include
    # inference_date: customer_id alone matches every cohort a customer has
    # ever been in, grading this month's prediction against old outcomes.
    ground_truth:
      label:
        source: source('lake', 'churn_panel')
        column: is_churn
      join_key: [customer_id, inference_date]
      maturity: "14d"
      metrics: [pr_auc, roc_auc]
      gates:
        - metric: pr_auc
          threshold: "{{ var('pr_auc_floor') }}"

    output:
      path: retention_scores
      columns: [customer_id, inference_date]
