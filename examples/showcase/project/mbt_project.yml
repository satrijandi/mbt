name: churn_lake
version: "0.1.0"

vars:
  # Meaningfully above the ~0.20 random-baseline PR-AUC of a ~20% positive
  # rate: a gate below the base rate never gates.
  pr_auc_floor: 0.3
  # The monthly cadence has its own floor: 30-day churn on month-start
  # snapshots runs a ~9% positive rate (random baseline ~0.09), so the
  # daily/weekly floor would be unreachable there.
  monthly_pr_auc_floor: 0.15

model_defaults:
  adapter: xgboost
