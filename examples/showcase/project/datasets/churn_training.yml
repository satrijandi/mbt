# The training set is a slice of the one lake table (sources.yml): the active
# population, in the cohorts whose outcomes are known.
datasets:
  - name: churn_training
    description: Active customers per weekly cohort, labeled with churn in the following 7 days.
    source: source('lake', 'churn_panel')
    # No `columns:` panel contract on purpose: the table's width is a scale
    # knob (hundreds of noise columns at --scale huge), so an enumerated list
    # would go stale with every reseed. The models' `features.include` lists
    # are the reviewed statement of what trains.
    #
    # The population: churned customers keep their rows (is_active = false,
    # is_churn NULL), so this filter is what makes a row a training example.
    filters:
      - "is_active = true"
    # Hashing customer_id keeps or drops every cohort of a customer together,
    # so `--vars '{sample_fraction: 0.25}'` trains on a coherent quarter.
    sample_key: customer_id
    label:
      column: is_churn
      definition: "churned during the 7 days after inference_date"
      # Declarative: the outcome is observed 7 days after the prediction
      # date - a weekly model with 7d label maturity. It is what lets mbt check that the embargo below and
      # the scoring node's ground_truth.maturity are long enough.
      horizon: "7d"
    split:
      strategy: temporal
      time_column: inference_date
      # Explicit weekly cohort boundaries (every inference_date is a Monday):
      # a month of training and September's labelled weeks for testing. Both
      # windows end before 2026-09-28, the newest cohort - its outcome week
      # closes 2026-10-05, so its label is still NULL, and it is the one
      # scoring reads - so no row with an unknown outcome is ever a training
      # or test example.
      #   train  2026-08-03 .. 2026-08-24   4 cohorts (August)
      #   gap    2026-08-31                 dropped by the embargo
      #   test   2026-09-07 .. 2026-09-21   3 cohorts (September, labelled)
      train: "2026-08-03:2026-09-07"
      test: "2026-09-07:2026-09-28"
      # At least the label horizon: it trims the train window's last 7 days,
      # so the last training cohort's outcome week never reaches the test
      # window.
      embargo: "7d"
    checks:
      - class_balance_report
      - no_future_columns
      - not_null:
          columns: [is_churn, inference_date, customer_id]
      # One row per customer per cohort - the table's natural key. The
      # `source:` form treats `columns` as ONE composite key and measures the
      # table as delivered, before filters and splits.
      - unique: {source: lake.churn_panel, columns: [customer_id, inference_date]}
      # A volume floor: a silently truncated table becomes a loud failure
      # instead of a quietly worse model.
      - row_count: {min: 1000}
    tags: [churn]
