# The wide cadence reads ONE relation (ADR-29). The join that builds it -
# population + matured labels + three feature histories, on their own entity
# keys and the one uniform inference_date - lives upstream, where relational
# work belongs: a step in scripts/generate_wide_data.py on the lake and Spark
# planes, a table the seeder materializes in-warehouse on the Snowflake plane,
# and a dbt model in a real deployment. mbt never sees it.
#
# What moved upstream with the join:
#   - the label join, INNER, so the newest cohort (whose outcome window has not
#     closed) is absent from the panel and cannot leak an immature outcome;
#   - the per-table pruning of etl_loaded_at, which all three feature tables
#     carry under the same name and which would collide in the panel;
#   - the entity crosswalk (customer_id to safe_id) that let transaction
#     history join at all.
# What stayed here: the split, the window, the sampling, the checks, and the
# statement of what the training set IS.
datasets:
  - name: wide_churn_training
    description: Monthly churn panel, joined upstream from population + labels + three feature histories.
    source: source('lake', 'monthly_panel')
    # No `columns:` panel contract here on purpose. The contract is the right
    # default for a real panel (see monthly_churn_training.yml, which declares
    # one), but this table's width is a deliberate stress knob
    # (`--filler-columns`, hundreds in the stress shape), so an enumerated list
    # would go stale every time the shape changed. The models' committed
    # `features.include` lists carry the review burden instead.
    #
    # Panel sampling: hashing customer_id keeps or drops every snapshot of a
    # customer together, so `--vars '{sample_fraction: 0.25}'` on the dev
    # inner loop trains on a coherent quarter of the population.
    sample_key: customer_id
    label:
      column: is_churn
      definition: "churned during the month after inference_date"
      # Declarative (ADR-29): the outcome is observed one calendar month after
      # the prediction date. It joins nothing - the upstream label table is
      # already keyed by the cohort's own inference_date and only appears once
      # that window closes - but declaring it is what lets mbt check that the
      # embargo below and the scoring pipeline's ground_truth.maturity agree.
      horizon: "1mo"
    split:
      strategy: temporal
      time_column: inference_date
      # Explicit ISO date ranges (the DS pins exact cohort boundaries).
      # The 2026-06-01 cohort stays out on purpose: it is the scoring batch.
      train: "2025-07-01:2026-04-01"
      test: "2026-04-01:2026-06-01"
      # At least the label horizon: a training row's outcome is observed a
      # month later, so without this the last training cohort's outcome falls
      # inside the test window.
      embargo: "1mo"
    checks:
      - class_balance_report
      - no_future_columns
      - not_null:
          columns: [is_churn, inference_date, as_of_date, customer_id, safe_id]
      # The upstream join can no longer be measured from here, so the two
      # things it used to guarantee are asserted on the result instead.
      #
      # One row per customer per cohort: the panel's natural key. This uses the
      # `source:` form, which treats `columns` as ONE composite key - the bare
      # form checks each column individually, and neither customer_id nor
      # inference_date is unique on its own in a panel (that is what a panel
      # is). Pointing it at the panel also runs it before filters and splits,
      # so it measures the relation as delivered rather than the slice used.
      - unique: {source: lake.monthly_panel, columns: [customer_id, inference_date]}
      # A volume floor: a silently collapsed upstream join becomes a loud
      # failure instead of a quietly smaller model.
      - row_count: {min: 1000}
    tags: [churn, wide]
