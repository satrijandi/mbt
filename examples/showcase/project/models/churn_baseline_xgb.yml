models:
  - name: churn_baseline_xgb
    description: "Deterministic xgboost baseline (bit-exact manifest reproduction; the CI-loop workhorse)"
    task: binary_classification
    adapter: xgboost
    owner: growth-ds@example.com
    tags: [churn]

    dataset: ref('churn_training')

    target: is_churn
    features:
      # Same 16 columns as churn_automl (see the note there).
      include:
        - age_years
        - region
        - income_band
        - plan_tier
        - contract_code
        - household_size
        - login_days_30d
        - days_since_login
        - sessions_30d
        - avg_session_min
        - txn_cnt_30d
        - txn_amt_sum_30d
        - txn_amt_avg_90d
        - merchant_diversity
        - top_category
        - support_tickets_90d
      categorical: [region, income_band, plan_tier, contract_code, top_category]

    hyperparameters:
      max_depth: 4
      learning_rate: 0.1
      n_estimators: 120
      scale_pos_weight: "{{ auto }}"

    evaluation:
      protocol: {split: temporal}
      metrics: [pr_auc, roc_auc, logloss]
      gates:
        - metric: pr_auc
          threshold: "{{ var('pr_auc_floor') }}"

    registration:
      name: churn_baseline_xgb
      stage_on_pass: staging

    seed: 42
