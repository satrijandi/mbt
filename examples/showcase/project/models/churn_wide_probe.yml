# The feature-selection probe: a fast LightGBM over ALL ~66 joined columns.
# Its build materializes the full-width dataset splits under target/, which
# is what scripts/select_features.py's ds-helper funnel (missing / unique /
# correlation filters + seeded LightGBM search) actually selects from; the
# probe's exported gain importance stays in target/run_results.json as a
# cross-check. The funnel commits the winners into churn_wide_automl's
# include list, so the AutoML model never has to chew through the filler
# columns - and the selection itself is a reviewable diff, not a hidden
# training-time step.
models:
  - name: churn_wide_probe
    description: "LightGBM importance probe over the full wide feature set (selection tool, not a serving model)"
    task: binary_classification
    adapter: lightgbm
    owner: growth-ds@example.com
    tags: [churn, wide]

    dataset: ref('wide_churn_training')

    target: is_churn
    features:
      include: ["*"]
      # Mirrors churn_wide_automl's exclude (see the comment there):
      # entity ids plus the time-anchored tenure_months.
      exclude: [customer_id, safe_id, tenure_months]

    # Shared with churn_wide_automl: casts DS-declared numeric-coded
    # categoricals (contract_code) to string before feature filtering.
    hooks: models/wide_hooks.py

    hyperparameters:
      n_estimators: 120
      num_leaves: 31
      learning_rate: 0.1
      scale_pos_weight: "{{ auto }}"

    evaluation:
      protocol: {split: temporal}
      metrics: [pr_auc, roc_auc]
      gates:
        - metric: pr_auc
          threshold: "{{ var('wide_pr_auc_floor') }}"

    # No registration: the probe exists for its feature_importance export.

    seed: 42
