# The feature-selection probe: a fast LightGBM over ALL ~66 joined columns.
# Its build materializes the full-width dataset splits under target/, which
# is what scripts/select_features.py's ds-helper funnel (missing / unique /
# correlation filters + seeded LightGBM search) actually selects from; the
# probe's exported gain importance stays in target/run_results.json as a
# cross-check. The funnel commits the winners into churn_wide_automl's
# include list, so the AutoML model never has to chew through the filler
# columns - and the selection itself is a reviewable diff, not a hidden
# training-time step.
models:
  - name: churn_wide_probe
    description: "LightGBM importance probe over the full wide feature set (selection tool, not a serving model)"
    task: binary_classification
    adapter: lightgbm
    owner: growth-ds@example.com
    tags: [churn, wide]

    dataset: ref('wide_churn_training')

    target: is_churn
    features:
      include: ["*"]
      # Mirrors churn_wide_automl's exclude (see the comment there):
      # the entity join keys, the spine's as_of_date lineage and
      # loaded_at_time audit columns, and the time-anchored tenure_months.
      exclude: [customer_id, safe_id, as_of_date, loaded_at_time, tenure_months]

      # The DS's categorical declaration over the FULL candidate width
      # (ADR-27). contract_code is int8-coded (0 = month-to-month ...
      # 3 = two-year) and its churn effect is deliberately non-monotone in
      # the code, so read as a magnitude it costs real signal; declaring it
      # here makes every adapter's native handling pick it up (LightGBM
      # native categoricals, H2O asfactor, SparkML StringIndexer).
      # The block is authoritative once present, so region and income_band
      # must be listed too - a string feature left undeclared is an error,
      # not a guess. scripts/select_features.py reads THIS list as the
      # funnel's candidate set and writes the surviving subset into
      # churn_wide_automl's generated block.
      categorical: [contract_code, region, income_band]

    hyperparameters:
      n_estimators: 120
      num_leaves: 31
      learning_rate: 0.1
      scale_pos_weight: "{{ auto }}"

    evaluation:
      protocol: {split: temporal}
      metrics: [pr_auc, roc_auc]
      gates:
        - metric: pr_auc
          threshold: "{{ var('wide_pr_auc_floor') }}"

    # No registration: the probe exists for its feature_importance export.

    seed: 42
