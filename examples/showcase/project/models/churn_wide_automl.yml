# The wide-scenario serving model: H2O AutoML (sparkling on the prod
# target) over the top-K features selected by the LightGBM probe. The
# include list below is GENERATED by scripts/select_features.py from the
# probe's gain importance and committed for review - editing it marks this
# model state:modified, so slim CI retrains exactly this model.
models:
  - name: churn_wide_automl
    description: "H2O AutoML on the LightGBM-selected top features of the wide multi-table panel"
    task: binary_classification
    adapter: h2o_automl
    owner: growth-ds@example.com
    tags: [churn, wide]

    dataset: ref('wide_churn_training')

    target: is_churn
    features:
      # BEGIN selected-features (generated by scripts/select_features.py; do not edit by hand)
      include:
        - avg_session_min
        - days_since_login
        - dem_f03
        - dem_f04
        - dem_f05
        - dem_f09
        - dem_f15
        - income_band
        - log_f01
        - log_f02
        - log_f03
        - log_f05
        - log_f12
        - log_f13
        - log_f15
        - login_days_30d
        - txn_amt_avg_90d
        - txn_cnt_30d
        - txn_f00
        - txn_f03
        - txn_f04
        - txn_f06
        - txn_f09
        - txn_f14
      # END selected-features
      exclude: [customer_id, safe_id]   # entity ids are join keys, not features

    # The known-deterministic spec shape (no time budgets, no CV): H2O's
    # documented determinism tier is 0.02 tolerance on all metrics.
    hyperparameters:
      max_models: 3
      include_algos: [GLM, GBM]
      nfolds: 0
      sort_metric: aucpr

    evaluation:
      protocol: {split: temporal}
      metrics: [pr_auc, roc_auc, logloss]
      gates:
        - metric: pr_auc
          threshold: "{{ var('wide_pr_auc_floor') }}"

    registration:
      name: churn_wide_automl
      stage_on_pass: staging

    seed: 42
