# The wide-scenario serving model: H2O AutoML (sparkling on the prod
# target) over the features selected by the ds-helper funnel in
# scripts/select_features.py (missing / single-value / correlation filters,
# then a seeded LightGBM randomized search keeping importance > 0). The
# include list below is GENERATED by that script and committed for review -
# editing it marks this model state:modified, so slim CI retrains exactly
# this model.
models:
  - name: churn_wide_automl
    description: "H2O AutoML on the LightGBM-selected top features of the wide multi-table panel"
    task: binary_classification
    adapter: h2o_automl
    owner: growth-ds@example.com
    tags: [churn, wide]

    dataset: ref('wide_churn_training')

    target: is_churn
    features:
      # BEGIN selected-features (generated by scripts/select_features.py; do not edit by hand)
      include:
        - age_years
        - contract_code
        - days_since_login
        - dem_f02
        - dem_f03
        - dem_f04
        - dem_f05
        - dem_f07
        - dem_f08
        - dem_f09
        - dem_f10
        - dem_f13
        - income_band
        - log_f00
        - log_f01
        - log_f09
        - login_days_30d
        - sessions_30d
        - txn_amt_avg_90d
        - txn_amt_sum_30d
        - txn_cnt_30d
        - txn_f00
        - txn_f05
        - txn_f09
      # END selected-features
      # DS-declared ignored columns, honored by the selection funnel too:
      # entity ids are join keys, and tenure_months is anchored to calendar
      # time - each newer cohort's tenure sits above the training window's,
      # so the feature_shift monitor (PSI vs the champion's training-time
      # baseline) breaches on it at serving no matter how predictive it
      # looks inside the training window.
      exclude: [customer_id, safe_id, tenure_months]

    # Shared with churn_wide_probe: casts DS-declared numeric-coded
    # categoricals (contract_code) to string before feature filtering, at
    # train time and again at scoring time (hooks parity, ADR-20).
    hooks: models/wide_hooks.py

    # The known-deterministic spec shape (no time budgets, no CV): H2O's
    # documented determinism tier is 0.02 tolerance on all metrics.
    hyperparameters:
      max_models: 3
      include_algos: [GLM, GBM]
      nfolds: 0
      sort_metric: aucpr

    evaluation:
      protocol: {split: temporal}
      metrics: [pr_auc, roc_auc, logloss]
      gates:
        - metric: pr_auc
          threshold: "{{ var('wide_pr_auc_floor') }}"

    registration:
      name: churn_wide_automl
      stage_on_pass: staging

    seed: 42
