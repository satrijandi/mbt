# mbt showcase stack (see ../DESIGN.md). Boot with profiles so each tier only
# pays for what it uses:
#   core  - SeaweedFS (S3 lake + artifact store) + MLflow (tracking/registry)
#   spark - standalone Spark cluster (pushdown + sparkling H2O training)
#   dev   - JupyterLab (the DS workbench; also the container mbt runs in)
#   obs   - Pushgateway + Prometheus + Grafana (docs/tutorial.md step 14)
#   ci    - Gitea + Woodpecker + Zot + webhook-sink (the P2/P3 CI loop).
#           Woodpecker boots with placeholder OAuth credentials;
#           scripts/ci_bootstrap.py creates the Gitea OAuth app, then re-ups
#           woodpecker-server with SHOWCASE_WOODPECKER_CLIENT/SECRET set.
#           Woodpecker's URLs are split-horizon (see its env block) so the
#           OAuth login works from a host browser, not just in-network.
#   orch  - Airflow (LocalExecutor + postgres) + git-sync (the P4
#           scheduling/CD half): DAGs live in the Gitea `deploy` repo,
#           git-sync reconciles them, tasks run the pinned deployable unit.
#
# Required env (set by the Makefile or the pytest fixture):
#   SHOWCASE_WORKSPACE - host dir bind-mounted at /workspace into every
#     container that trains or reads data. The Spark adapters stage split
#     writes through driver-local temp paths that executors must also see
#     (ADR-17), so this identical-path shared mount is load-bearing.
# Host ports are overridable; defaults avoid common dev-machine squatters.

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: ${SHOWCASE_S3_KEY:-mbtadmin}
  AWS_SECRET_ACCESS_KEY: ${SHOWCASE_S3_SECRET:-mbtsecret}
  AWS_DEFAULT_REGION: us-east-1
  AWS_ENDPOINT_URL_S3: http://seaweedfs:8333

x-airflow-env: &airflow-env
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
  # LocalExecutor: real parallel tasks without a Celery fleet (sqlite would
  # force SequentialExecutor, which is invalid with LocalExecutor anyway).
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  # FabAuthManager instead of Airflow 3's default SimpleAuthManager: it keeps
  # deterministic admin/admin credentials (SimpleAuthManager generates random
  # passwords into a file) and serves the same JWT /auth/token endpoint.
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  # DAGs come from the git-synced deploy repo, never from an image bake.
  AIRFLOW__CORE__DAGS_FOLDER: /gitsync/current/dags
  AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "10"
  AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "5"
  # Airflow 3 tasks call back into the api-server's execution API, and the
  # in-cluster log fetch is signed with the JWT secret - both must be shared
  # across every airflow service for the split-component setup to work.
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
  AIRFLOW__API_AUTH__JWT_SECRET: mbt-showcase-airflow-jwt-secret
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  # The DAG tasks drive the docker daemon (deployable-unit containers).
  _PIP_ADDITIONAL_REQUIREMENTS: "docker==7.1.0"

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.39
    profiles: [core]
    # -ip.bind: weed binds the container IP by default, which breaks
    # localhost healthchecks.
    command: server -ip.bind=0.0.0.0 -s3 -s3.config=/etc/seaweedfs/s3_config.json -dir=/data
    volumes:
      - seaweed-data:/data
      - ./seaweedfs/s3_config.json:/etc/seaweedfs/s3_config.json:ro
    ports:
      # 8333 is the S3 API: signed requests only - a bare browser GET
      # returns AccessDenied. Humans browse the lake through the filer UI
      # on 8888 instead (-s3 rides on the filer, so it is always running).
      - "${SHOWCASE_S3_PORT:-8333}:8333"
      - "${SHOWCASE_FILER_PORT:-8388}:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/healthz"]
      interval: 3s
      timeout: 5s
      retries: 30

  mlflow:
    image: ${SHOWCASE_RUNNER_IMAGE:-mbt-showcase-runner:dev}
    profiles: [core]
    # --allowed-hosts: mlflow 3.x rejects non-localhost Host headers (DNS
    # rebinding protection); in-network clients send Host: mlflow:5000.
    # Wildcard is a demo posture on an isolated compose network.
    command: >
      mlflow server --backend-store-uri sqlite:////data/mlflow.db
      --host 0.0.0.0 --port 5000 --workers 1 --allowed-hosts "*"
    volumes:
      - mlflow-data:/data
    ports:
      - "${SHOWCASE_MLFLOW_PORT:-5501}:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 60

  spark-master:
    image: ${SHOWCASE_RUNNER_IMAGE:-mbt-showcase-runner:dev}
    profiles: [spark]
    command: spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080
    ports:
      - "${SHOWCASE_SPARK_UI_PORT:-8380}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/json/ >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 30

  spark-worker:
    image: ${SHOWCASE_RUNNER_IMAGE:-mbt-showcase-runner:dev}
    profiles: [spark]
    command: spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 4 --memory 4g --webui-port 8081
    environment:
      <<: *s3-env
    volumes:
      - ${SHOWCASE_WORKSPACE:?set SHOWCASE_WORKSPACE to the shared workspace dir}:/workspace
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081 >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 30

  jupyterlab:
    image: ${SHOWCASE_RUNNER_IMAGE:-mbt-showcase-runner:dev}
    profiles: [dev]
    command: jupyter lab --ip 0.0.0.0 --port 8888 --no-browser --allow-root --ServerApp.token='' --ServerApp.password=''
    working_dir: /workspace
    environment:
      <<: *s3-env
      TMPDIR: /workspace/tmp
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ${SHOWCASE_WORKSPACE:?set SHOWCASE_WORKSPACE to the shared workspace dir}:/workspace
    ports:
      - "${SHOWCASE_JUPYTER_PORT:-8899}:8888"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/api >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 30

  gitea:
    # Pinned exact deliberately (like every service here): a rolling tag
    # lets upstream behavior change under the suite overnight with no repo
    # diff - Gitea >= 1.26's PUBLIC_URL_DETECTION default flip was exactly
    # that shape of breakage.
    image: gitea/gitea:1.27.0-rootless
    profiles: [ci]
    environment:
      # Headless init: skip the web installer entirely.
      GITEA__security__INSTALL_LOCK: "true"
      # In-network canonical URL: Woodpecker clones and comments via this.
      GITEA__server__ROOT_URL: http://gitea:3000/
      # Gitea >= 1.26 defaults to deriving public URLs from the request's
      # Host header ("auto"), so a PR opened via the host-mapped port would
      # put localhost:<hostport> clone URLs into the webhook payload - which
      # Woodpecker's step containers cannot reach. Pin to ROOT_URL always.
      GITEA__server__PUBLIC_URL_DETECTION: never
      # Gitea blocks webhooks to private addresses by default; Woodpecker is
      # exactly such a target on the compose network.
      GITEA__webhook__ALLOWED_HOST_LIST: woodpecker-server
    ports:
      - "${SHOWCASE_GITEA_PORT:-3305}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/healthz >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 30

  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v3.16.0
    profiles: [ci]
    environment:
      WOODPECKER_OPEN: "true"
      # Split-horizon URLs so a HUMAN BROWSER on the host can complete the
      # Gitea OAuth login (the scripted bootstrap drives the exact same
      # flow). The port defaults must match the published ports below.
      #   WOODPECKER_HOST                     browser-facing Woodpecker: UI
      #     links and the OAuth redirect_uri (the Gitea app registers it).
      #   WOODPECKER_EXPERT_WEBHOOK_HOST      what Gitea's webhooks call -
      #     in-network, or push/PR events never reach Woodpecker.
      #   WOODPECKER_EXPERT_FORGE_OAUTH_HOST  browser-facing Gitea: where
      #     /authorize sends the user's browser to log in and grant.
      #   WOODPECKER_GITEA_URL                server-side forge API + OAuth
      #     token exchange + CI_FORGE_URL in steps - stays in-network.
      WOODPECKER_HOST: http://localhost:${SHOWCASE_WOODPECKER_PORT:-8305}
      WOODPECKER_EXPERT_WEBHOOK_HOST: http://woodpecker-server:8000
      WOODPECKER_EXPERT_FORGE_OAUTH_HOST: http://localhost:${SHOWCASE_GITEA_PORT:-3305}
      WOODPECKER_AGENT_SECRET: mbt-showcase-agent-secret
      WOODPECKER_ADMIN: mbtops
      WOODPECKER_GITEA: "true"
      WOODPECKER_GITEA_URL: http://gitea:3000
      # Placeholders until ci_bootstrap.py creates the OAuth app and the
      # stack re-ups this service with the real values (env change =>
      # compose recreates it; its sqlite state is per-session anyway).
      WOODPECKER_GITEA_CLIENT: ${SHOWCASE_WOODPECKER_CLIENT:-pending-bootstrap}
      WOODPECKER_GITEA_SECRET: ${SHOWCASE_WOODPECKER_SECRET:-pending-bootstrap}
    ports:
      - "${SHOWCASE_WOODPECKER_PORT:-8305}:8000"

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v3.16.0
    profiles: [ci]
    environment:
      WOODPECKER_SERVER: woodpecker-server:9000
      WOODPECKER_AGENT_SECRET: mbt-showcase-agent-secret
      WOODPECKER_BACKEND: docker
      # Step containers join the compose network so they resolve gitea,
      # seaweedfs, mlflow, and webhook-sink by service name. The default
      # network is named <project>_default; the fixture/Makefile export it.
      WOODPECKER_BACKEND_DOCKER_NETWORK: ${SHOWCASE_NETWORK:-mbt-showcase_default}
      # One workflow at a time: RAM guardrail (DESIGN.md section 2).
      WOODPECKER_MAX_WORKFLOWS: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - woodpecker-server

  zot:
    # v2.1.16 pin is load-bearing: v2.1.17+ added hard HTTP timeouts
    # (project-zot/zot#3984) that kill multi-GB blob uploads on slow disks -
    # the ~5GB runner-image layer's push died mid-upload on ubuntu-latest
    # (docker retried then "use of closed network connection"). Do not bump
    # past v2.1.16 until project-zot/zot#4140 / #4149 land in a release.
    image: ghcr.io/project-zot/zot:v2.1.16
    profiles: [ci]
    # OCI registry for the deployable unit + oras provenance artifacts.
    # In-network pushes (oras) use zot:5000 over plain HTTP; the docker
    # daemon pushes/pulls via the published localhost port, which docker
    # treats as insecure-by-default - no daemon config needed (DESIGN.md
    # open question 1, smoke-tested on Docker Desktop for macOS).
    ports:
      - "127.0.0.1:${SHOWCASE_ZOT_PORT:-15000}:5000"

  webhook-sink:
    image: ${SHOWCASE_RUNNER_IMAGE:-mbt-showcase-runner:dev}
    profiles: [ci]
    command: python /workspace/bootstrap/webhook_sink.py
    volumes:
      - ${SHOWCASE_WORKSPACE:?set SHOWCASE_WORKSPACE to the shared workspace dir}:/workspace
    ports:
      - "${SHOWCASE_WEBHOOK_PORT:-9309}:9099"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9099/ >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 30

  airflow-db:
    image: postgres:18-alpine
    profiles: [orch]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 3s
      timeout: 5s
      retries: 30

  airflow-init:
    image: apache/airflow:3.3.0
    profiles: [orch]
    # The image entrypoint handles db migration (core + FAB provider tables)
    # and admin-user creation when these _AIRFLOW_* vars are set - the
    # supported one-shot init flow for the split-component 3.x setup.
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      _PIP_ADDITIONAL_REQUIREMENTS: ""
    command: airflow version
    depends_on:
      airflow-db:
        condition: service_healthy
    restart: "no"

  airflow-scheduler:
    image: apache/airflow:3.3.0
    profiles: [orch]
    # The DAG tasks drive the docker daemon (LocalExecutor runs them
    # in-scheduler), and the image's airflow user must stay non-root (the
    # official entrypoint misbehaves under root with pip requirements), so
    # the container joins the socket's owning group. That group is 0 on
    # Docker Desktop's VM but the `docker` group on native Linux hosts -
    # the Makefile and the test harness probe it (stat the socket).
    group_add: ["${DOCKER_SOCK_GID:-0}"]
    environment:
      <<: *airflow-env
    command: scheduler
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - airflow-dags:/gitsync:ro
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      # Tasks run in-scheduler (LocalExecutor) and talk to the api-server's
      # execution API from their first heartbeat.
      airflow-apiserver:
        condition: service_healthy

  # Airflow 3 split DAG parsing out of the scheduler into its own component;
  # without it no DAG ever leaves the "new file" state.
  airflow-dag-processor:
    image: apache/airflow:3.3.0
    profiles: [orch]
    environment:
      <<: *airflow-env
    command: dag-processor
    volumes:
      - airflow-dags:/gitsync:ro
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-apiserver:
    image: apache/airflow:3.3.0
    profiles: [orch]
    environment:
      <<: *airflow-env
    command: api-server
    volumes:
      - airflow-dags:/gitsync:ro
    ports:
      - "${SHOWCASE_AIRFLOW_PORT:-8280}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v2/monitor/health >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 60

  git-sync:
    image: registry.k8s.io/git-sync/git-sync:v4.7.0
    profiles: [orch]
    # Root so it can write the shared named volume; --max-failures=-1 keeps
    # it retrying until ci_bootstrap.py has seeded the deploy repo.
    user: "0:0"
    command:
      - --repo=http://gitea:3000/mbt-showcase/deploy.git
      - --ref=main
      - --period=5s
      - --root=/gitsync
      - --link=current
      - --max-failures=-1
    volumes:
      - airflow-dags:/gitsync

  pushgateway:
    image: prom/pushgateway:v1.11.3
    profiles: [obs]
    ports:
      - "${SHOWCASE_PUSHGW_PORT:-9491}:9091"

  prometheus:
    image: prom/prometheus:v3.13.1
    profiles: [obs]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "${SHOWCASE_PROMETHEUS_PORT:-9490}:9090"

  grafana:
    image: grafana/grafana:13.1.0
    profiles: [obs]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${SHOWCASE_GRAFANA_PORT:-3390}:3000"

volumes:
  seaweed-data:
  mlflow-data:
  airflow-dags:
