# Scrapes the Pushgateway (mbt surfaces are batch jobs that exit; the
# gateway persists last-known gauges and stamps push_time_seconds, which the
# staleness rule needs). honor_labels keeps the pushed group labels.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
